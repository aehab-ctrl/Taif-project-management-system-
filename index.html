  /* ---- Page 2: quarterly timeline ---- */
  const qs = quartersRange(
    ms.reduce((min,m)=>m.start<min?m.start:min, p.startDate||ms[0].start),

  const years = [...new Set(qs.map(q=>q.year))];

  const quarterHeaderCells = qs.map(q=>`<td bgcolor="#537E54" style="text-align:center;font-size:8px"><font color="#FFFFFF"><b>Q${q.q}</b></font></td>`).join('');
  const page2 = `<br style="page-break-before:always">

  return page1 + page2 + page3;
}
function downloadReportWord(id){
  const p = projectById(id);
  if(!p) return;
  const html = wordHeader('تقرير حالة مشروع — ' + p.nameAr) + buildReportWordHtml(p) + wordFooter();
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `Project-Status-Report-${p.code}-${today()}.doc`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`جاري تنزيل تقرير "${p.nameAr}" كملف Word قابل للتعديل...`);
}
function printProjectReport(id){
  const p = projectById(id);
  document.getElementById('printArea').innerHTML = buildReportHtml(p);
  window.print();
}
function logReportIssued(id){
  const p = projectById(id);
  p.reportsLog = p.reportsLog||[];
  p.reportsLog.push({id:uid('REP'), date:today(), snapshotCompletion:p.currentCompletion, snapshotStatus:overallStatus(p).label});
  save(); toast('تم تسجيل إصدار التقرير في سجل المشروع');
}

function downloadTemplate(kind){

    cost:{file:'templates/Cost-Management-Plan-Template.docx', base:'Cost-Management-Plan'}

  const pid = document.getElementById('fillProject')?.value;
  const p = pid ? projectById(pid) : null;

function downloadFilledTemplate(kind){
  const pid = document.getElementById('fillProject')?.value;
  const p = pid ? projectById(pid) : null;
  const code = p ? p.code : 'PROJECTCODE';
  const excelKinds = { progress:{fn:buildProgressUpdateXlsHtml, base:'Progress-Update'}, schedule:{fn:buildScheduleXlsHtml, base:'Project-Schedule'} };
  if(excelKinds[kind]){
    const conf = excelKinds[kind];
    const html = conf.fn(p);
    downloadXls(html, `${conf.base}-${code}-${today()}.xls`);
    toast(p ? `جاري تنزيل النموذج معبأً ببيانات "${p.nameAr}"...` : 'جاري تنزيل النموذج الفارغ...');
    return;
  }
  let html, base;
  if(kind==='charter'){ html = buildCharterHtml(p); base='Project-Charter'; }
  else if(kind==='certificate'){ html = buildCertificateHtml(p); base='Completion-Certificate'; }
  else if(kind==='closure'){ html = buildClosureHtml(p); base='Project-Closure'; }
  else if(kind==='change'){ html = buildChangeRequestHtml(p); base='Change-Request'; }
  else if(kind==='costplan'){ html = buildCostPlanDocHtml(p); base='Cost-Management-Plan'; }
  else return;
  const fname = `${base}-${code}-${today()}.doc`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(p ? `جاري تنزيل النموذج معبأً ببيانات "${p.nameAr}"...` : 'جاري تنزيل النموذج الفارغ...');
}

  const chip = document.getElementById('userChip');
  chip.innerHTML = `<span class="av">${esc((state.org.user||'A').trim().charAt(0))}</span> ${esc(state.org.user)}`;
  document.title = state.org.nameAr + ' | ' + t('جامعة الطائف');
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `tu-pms-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('تم تصدير النسخة الاحتياطية');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.projects) throw new Error('invalid');
      state = data; save(); applyOrgBranding(); toast('تم استيراد البيانات بنجاح'); go('dashboard');
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('سيتم حذف جميع البيانات الحالية واستعادة الإعدادات الافتراضية. هل تريد المتابعة؟')) return;
  state = defaultState(); save(); applyOrgBranding(); toast('تمت إعادة تعيين البيانات'); go('dashboard');
}

/* ================= CSV EXPORT ================= */
function exportProjectsCSV(){
  const rows = [['رمز المشروع','اسم المشروع','مدير المشروع','المرحلة','تاريخ البداية','تاريخ النهاية','نسبة الإنجاز','الحالة','الميزانية المعتمدة','الصرف الفعلي']];
  state.projects.forEach(p=>{
    const st = overallStatus(p);
    rows.push([p.code,p.nameAr,p.manager||'',p.phase,p.startDate||'',p.endDate||'',(p.currentCompletion||0)+'%',st.label,p.allocatedBudget||0,p.actualSpend||0]);
  });
  const csv = '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `portfolio-report-${today()}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('تم تجهيز ملف CSV متوافق مع Excel');
}

/* ================= MODAL / TOAST ================= */
function showModal(title, body){
  document.getElementById('modalBox').innerHTML = `<div class="modal-head"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').setAttribute('aria-hidden','false');
  setTimeout(()=>document.querySelector('#modalBox input, #modalBox select, #modalBox textarea')?.focus(),40);
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal').setAttribute('aria-hidden','true');
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
