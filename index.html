<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام تخطيط الموارد المؤسسية (ERP) | جامعة الطائف</title>
<meta name="description" content="نظام تخطيط الموارد المؤسسية (ERP) - جامعة الطائف">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
<style>
:root{
  --primary:#D5B254; --primary-dark:#a9862f; --primary-light:#faf4e2;
  --secondary:#537E54; --green:#2f7d45; --red:#c83b3b; --amber:#c98a1f; --gray:#8b8f91; --blue:#2f68b2;
  --ink:#24302a; --muted:#6f7871; --bg:#f5f4ef; --line:#e6e1d5; --white:#fff;
  --shadow:0 10px 28px rgba(48,55,43,.08); --radius:12px;
  --sidebar-bg:#ffffff; --sidebar-bg-2:#faf9f6; --sidebar-text:#4d5560; --sidebar-text-dim:#8b93a0;
  --sidebar-border:#e7e5df;
  --topbar-grad:linear-gradient(90deg,#cfa53c,#b8901f); --purple:#5b4fd6; --purple-dark:#453cb0; --purple-light:#eeecfc;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9d3c2;border-radius:10px}

/* ===== ERP module switcher (top-level dark strip) ===== */
.module-bar{display:flex;gap:6px;padding:8px 16px;background:#fbfaf6;border-bottom:1px solid var(--line);overflow-x:auto}
.module-btn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:transparent;border-radius:9px;padding:8px 13px;font-size:12px;font-weight:700;color:#6c7280;white-space:nowrap}
.module-btn .ico{font-size:14px}
.module-btn:hover{color:var(--ink);background:#f0eee6}
.module-btn.active{background:var(--purple);color:#fff}

/* ===== shell: sidebar (full height, dark) + main column (topbar + content) ===== */
.shell{display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 42px)}
.sidebar{background:var(--sidebar-bg);border-left:1px solid var(--sidebar-border);display:flex;flex-direction:column;position:sticky;top:42px;height:calc(100vh - 42px);overflow:auto}
.sidebar-brand{display:flex;align-items:center;gap:12px;padding:18px 16px;border-bottom:1px solid var(--sidebar-border)}
.sidebar-brand img{height:38px;width:auto;object-fit:contain}
.sidebar-brand .system b{display:block;font-size:13px;color:var(--ink);letter-spacing:.2px}
.sidebar-brand .system span{font-size:9.5px;color:var(--sidebar-text-dim)}
.nav-scroll{padding:12px 10px;flex:1}
.section-label{font-size:10px;color:#9a9d98;padding:14px 10px 6px;text-transform:uppercase;letter-spacing:.5px}
.nav-btn{width:100%;border:0;background:none;text-align:right;color:var(--sidebar-text);padding:10px 12px;border-radius:9px;margin:2px 0;display:flex;gap:10px;align-items:center;font-size:12.6px}
.nav-btn:hover{background:#f5f4ee;color:var(--ink)}
.nav-btn.active{background:var(--primary-light);color:#6b5420;border-right:3px solid var(--primary);font-weight:700}
.nav-btn .ico{width:18px;text-align:center;font-size:15px}
.aside-foot{margin:14px 10px 6px;background:#faf8f3;border:1px solid var(--sidebar-border);border-radius:12px;padding:12px}
.aside-foot b{font-size:11px;color:var(--ink)}
.aside-foot small{display:block;color:var(--sidebar-text-dim);margin-top:5px;line-height:1.6}

.main-col{display:flex;flex-direction:column;min-width:0}
.topbar{height:58px;background:var(--topbar-grad);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:30;color:#fff}
.hamburger{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:8px;width:34px;height:34px;font-size:15px}
.hamburger:hover{background:rgba(255,255,255,.28)}
.topbar-title{font-weight:800;font-size:14.5px;flex:1}
.topbar-actions{display:flex;gap:10px;align-items:center}
.lang-select{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:8px;padding:7px 10px;font-size:12px;font-weight:700}
.lang-select option{color:#222}
.icon-btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:10px;padding:8px 10px;font-size:14px;position:relative}
.icon-btn:hover{background:rgba(255,255,255,.22)}
.badge-dot{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:9px;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
.user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px 6px 6px;font-weight:700;color:#fff;font-size:12px}
.user-chip .av{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--purple);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
.breadcrumb-strip{background:#fff;border-bottom:1px solid var(--line);padding:11px 22px;font-size:12px;color:var(--muted);font-weight:700}

main{padding:26px 28px 60px;max-width:1500px;width:100%;margin:auto}

/* ===== headers / cards ===== */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{color:var(--purple);font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.head h1{margin:4px 0 6px;font-size:24px}
.head p{margin:0;color:var(--muted);max-width:640px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;background:var(--purple);color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;font-size:12.5px;transition:.15s}
.btn:hover{background:var(--purple-dark)}
.btn.secondary{background:#fff;color:var(--purple-dark);border-color:#cfc9f5}
.btn.secondary:hover{background:var(--purple-light)}
.btn.ghost{background:#fff;color:#4f5b54;border-color:var(--line)}
.btn.ghost:hover{background:#f7f4ed}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#a92f2f}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:7px}
.btn:focus,.nav-btn:focus,input:focus,select:focus,textarea:focus{outline:3px solid rgba(91,79,214,.25);outline-offset:1px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}}
@media(max-width:720px){.shell{grid-template-columns:1fr}.sidebar{display:none}.grid{grid-template-columns:1fr}}
body.sidebar-collapsed .shell{grid-template-columns:0 1fr}
body.sidebar-collapsed .sidebar{width:0;overflow:hidden}

.kpi-card small{color:var(--muted);font-size:11px}
.kpi-card b{display:block;font-size:26px;margin:5px 0 2px}
.kpi-card em{font-style:normal;color:var(--muted);font-size:11px}
.stat-box{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat-box small{color:var(--muted);font-size:10.5px;display:block}
.stat-box b{font-size:19px}

.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.title h2{margin:0;font-size:15.5px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.badge-count{background:var(--purple-light);color:var(--purple-dark);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700}

.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}
.status .dot{width:7px;height:7px;border-radius:50%}
.status.green{background:#e9f4ec;color:#1f6a35}.status.green .dot{background:var(--green)}
.status.red{background:#fbeaea;color:#a92f2f}.status.red .dot{background:var(--red)}
.status.gray{background:#f1f1ee;color:#5c605d}.status.gray .dot{background:var(--gray)}
.status.blue{background:#eaf1fa;color:#204d85}.status.blue .dot{background:var(--blue)}
.status.gold{background:var(--primary-light);color:#83651e}.status.gold .dot{background:var(--primary)}
.status.amber{background:#fbf1e2;color:#8a5c0f}.status.amber .dot{background:var(--amber)}

.progress-row{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:8px;background:#eee9dc;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--purple),#8f86e8);border-radius:99px}

.breadcrumb{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.breadcrumb b{color:var(--ink)}
.axis-block{margin-bottom:20px}
.axis-block>.axis-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.axis-block>.axis-title h3{margin:0;font-size:14px;color:var(--purple-dark)}
.goal-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.goal-cards{grid-template-columns:1fr}}
.goal-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
.goal-card h4{margin:0 0 8px;font-size:12.5px;line-height:1.5}
.kpi-table{width:100%;border-collapse:collapse;font-size:12px}
.kpi-table th{background:#faf8f3;padding:8px;text-align:right;border:1px solid var(--line);font-size:11px;color:var(--muted)}
.kpi-table td{padding:6px 8px;border:1px solid var(--line);vertical-align:middle}
.kpi-table input{width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:6px}
.field.full select, .field select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}

.notice{background:#faf6ea;border:1px dashed #e0cf9c;border-radius:11px;padding:12px 14px;margin-bottom:16px;font-size:12.3px}
.notice strong{display:block;color:#755c1f;margin-bottom:3px;font-size:12.5px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.empty strong{display:block;color:#4c554e;margin-bottom:4px}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-width:150px}
.field textarea{min-height:70px;resize:vertical;font-family:inherit}
.field.full{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.three-col{grid-template-columns:1fr 1fr 1fr}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:640px){.form-grid,.form-grid.three-col{grid-template-columns:1fr}}

.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{text-align:right;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px 12px;border-bottom:2px solid var(--line)}
.table td{padding:11px 12px;border-bottom:1px solid #f0ede3;font-size:12.6px;vertical-align:middle}
.table tr:hover td{background:#fbfaf6}
.link{background:none;border:0;color:var(--secondary);font-weight:700;text-decoration:underline;padding:0;font-size:inherit;cursor:pointer}
.link:hover{color:var(--primary-dark)}
.muted{color:var(--muted)}
.small{font-size:11.5px}

.detail-banner{background:linear-gradient(135deg,#2b3a30,#3d4f41);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:16px}
.detail-banner small{opacity:.75;font-size:11px}
.detail-banner h1{margin:6px 0 8px;font-size:22px}
.detail-banner .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.detail-banner .meta div{background:rgba(255,255,255,.08);border-radius:9px;padding:9px 11px}
.detail-banner .meta small{display:block;opacity:.7}
.detail-banner .meta b{font-size:14px}
@media(max-width:800px){.detail-banner .meta{grid-template-columns:1fr 1fr}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;color:#5c655e}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.row{padding:9px 0;border-bottom:1px solid #f0ede3}
.row:last-child{border-bottom:0}

/* gantt */
.gantt-row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f2efe6}
.gantt-row .gt-label{font-size:12px}
.gantt-row .gt-label small{display:block;color:var(--muted);font-size:10.5px}
.gt-track{position:relative;height:20px;background:#f4f2ea;border-radius:6px}
.gt-bar{position:absolute;top:2px;bottom:2px;background:linear-gradient(90deg,var(--secondary),#8fb08c);border-radius:5px}
.gt-bar.late{background:linear-gradient(90deg,var(--red),#e08181)}
.gt-fill{position:absolute;inset:0;background:rgba(0,0,0,.18);border-radius:5px 0 0 5px}
.gt-header{display:grid;grid-template-columns:220px 1fr;gap:10px;margin-bottom:6px;font-size:10.5px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(24,28,22,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{margin:0;font-size:16.5px}
.close{border:0;background:#f1efe6;border-radius:8px;width:30px;height:30px;font-size:14px}

/* templates */
.tpl-card{display:flex;flex-direction:column;gap:10px}
.tpl-card .tpl-ico{width:44px;height:44px;border-radius:11px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px}
.tpl-card h3{margin:0;font-size:14.5px}
.tpl-card p{margin:0;color:var(--muted);font-size:12px;flex:1}

/* toast */
.toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px}

/* print report */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px}
  .rp-page{page-break-after:always}
}
.rp-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--primary);padding-bottom:14px;margin-bottom:16px}
.rp-head img{height:46px}
.rp-head .rp-title{text-align:left}
.rp-title h1{margin:0;font-size:18px}
.rp-title small{color:var(--muted)}
.rp-section{margin-bottom:16px}
.rp-section h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--secondary);border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 8px}
.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rp-grid div{background:#faf8f3;border-radius:8px;padding:8px 10px}
.rp-grid small{display:block;color:var(--muted);font-size:10px}
.rp-table{width:100%;border-collapse:collapse;font-size:11.5px}
.rp-table th,.rp-table td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.rp-table th{background:#faf8f3}
.rp-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}

/* ---- Executive report v2 (dashboard-style, matches reference report) ---- */
.rp2-title-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--primary);padding:0 2px 12px;margin-bottom:14px}
.rp2-title-bar img{height:38px}
.rp2-title-bar h1{font-size:18px;margin:0;color:#3c3417}
.rp2-info-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rp2-info-card{flex:1;min-width:95px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rp2-info-card .h{background:var(--primary);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:6px 4px}
.rp2-info-card .v{background:#fff;font-size:10.5px;text-align:center;padding:7px 4px;font-weight:700;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.4}
.rp2-desc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;background:#fff}
.rp2-desc .h{font-weight:800;color:var(--secondary);margin-bottom:4px;font-size:10.5px}
.rp2-cols{display:grid;grid-template-columns:1fr 1.35fr;gap:12px;margin-bottom:10px}
.rp2-charts{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.rp2-chart-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-around;margin-bottom:8px}
.rp2-chart-col{display:flex;flex-direction:column;align-items:center}
.rp2-donut{width:96px;height:96px;border-radius:50%}
.rp2-donut-label{text-align:center;font-size:9.5px;margin-top:6px;font-weight:700}
.rp2-bars{display:flex;gap:12px;align-items:flex-end;height:96px}
.rp2-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:34px}
.rp2-bar{width:24px;border-radius:4px 4px 0 0;position:relative}
.rp2-bar-val{font-size:9px;font-weight:800;margin-bottom:2px}
.rp2-legend{display:flex;gap:12px;justify-content:center;font-size:9px;margin-top:6px;flex-wrap:wrap}
.rp2-legend span{display:inline-flex;align-items:center;gap:4px}
.rp2-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.rp2-contract{display:flex;gap:8px;margin-top:8px}
.rp2-contract div{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;background:#fff}
.rp2-contract small{display:block;color:var(--muted);font-size:9px}
.rp2-contract b{font-size:11.5px}
.rp2-targets{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rp2-targets table{width:100%;border-collapse:collapse}
.rp2-targets th{background:var(--primary);color:#fff;font-size:10px;padding:7px 8px;text-align:right}
.rp2-targets td{border-top:1px solid var(--line);padding:7px 8px;font-size:10.5px}
.rp2-foot-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:9.5px;padding-top:8px;border-top:1px solid var(--line)}
.rp2-tl-wrap{overflow-x:auto}
.rp2-tl-table{width:100%;border-collapse:collapse;font-size:8.6px}
.rp2-tl-table th{background:var(--primary);color:#fff;padding:3px 1px;text-align:center;font-weight:700}
.rp2-tl-table th.yr{font-size:9.5px;padding:4px 1px}
.rp2-tl-table td{border:1px solid #ece7d9;padding:0;text-align:center;height:19px;min-width:14px}
.rp2-tl-table td.lbl{border:1px solid var(--line);text-align:right;padding:4px 7px;font-size:9px;min-width:150px;background:#fff;font-weight:600}
.rp2-tl-table td.pct{font-weight:800;background:#fff;font-size:9px}
.rp2-tl-table td.num{background:#faf8f3;font-weight:700;font-size:9px}
.rp2-tl-fill{background:linear-gradient(90deg,var(--secondary),#8fb08c);height:100%}
.rp2-tl-caption{font-size:9.5px;color:var(--muted);margin-top:8px;text-align:center}
.rp2-dl-table{width:100%;border-collapse:collapse;font-size:10px}
.rp2-dl-table th{background:var(--primary);color:#fff;padding:8px 7px;text-align:right}
.rp2-dl-table td{border:1px solid var(--line);padding:8px 7px;vertical-align:middle}

[hidden]{display:none!important}

/* ===== LTR (English) overrides for chrome elements ===== */
[dir="ltr"] body{direction:ltr}
[dir="ltr"] .nav-btn{text-align:left}
[dir="ltr"] .nav-btn.active{border-right:0;border-left:3px solid var(--primary)}
[dir="ltr"] .badge-dot{left:auto;right:-4px}
[dir="ltr"] .table th,[dir="ltr"] .kpi-table th{text-align:left}
[dir="ltr"] .toast{left:auto;right:22px}
[dir="ltr"] .user-chip{padding:6px 6px 6px 12px}
</style>
</head>
<body>

<div class="module-bar" id="moduleBar"></div>

<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-brand">

  const ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds = ['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function three(num){
    let s='';
    const h=Math.floor(num/100), r=num%100;
    if(h) s += hundreds[h];
    if(r){
      if(s) s += ' و';
      if(r<20) s += ones[r];
      else { const t=Math.floor(r/10), o=r%10; s += (o?ones[o]+' و':'') + tens[t]; }
    }
    return s;
  }
  const groups = [ [1000000000,'مليار'], [1000000,'مليون'], [1000,'ألف'], [1,''] ];
  let parts = [];
  let rem = n;
  for(const [val,label] of groups){
    if(rem>=val){
      const count = Math.floor(rem/val);
      rem = rem % val;
      if(val===1){ if(count>0) parts.push(three(count)); }
      else parts.push(three(count) + ' ' + label + (count>=3&&count<=10?'':''));
    }
  }
  return parts.join(' و') + ' ريال سعودي فقط لا غير';
}

/* ================= STRATEGY MODEL (PLAN → AXIS → GOAL → INITIATIVE → PROJECT) ================= */
function computeProgress(ps){
  if(!ps || !ps.length) return 0;
  const totalW = ps.reduce((a,p)=>a+Number(p.allocatedBudget||1),0) || ps.length;
  const sum = ps.reduce((a,p)=>a+Number(p.currentCompletion||0)*Number(p.allocatedBudget||1),0);
  return Math.round(sum/totalW);
}
function buildStrategy(projects){
  const axesMap = new Map();
  const goalsMap = new Map();
  const initMap = new Map();
  let axisOrder=0, goalOrder=0, initOrder=0;

  projects.forEach(p=>{
    const tg = (p.transformationGoal||'').trim() || 'محاور عامة';
    const hasDash = tg.includes('—');
    const axisTitle = hasDash ? tg.split('—')[0].trim() : tg;
    const goalDisplay = hasDash ? tg.split('—').slice(1).join('—').trim() : tg;

    if(!axesMap.has(axisTitle)) axesMap.set(axisTitle, {id:uid('AX'), code:'AX-'+String(++axisOrder).padStart(2,'0'), title:axisTitle, order:axisOrder});
    const axis = axesMap.get(axisTitle);

    if(!goalsMap.has(tg)) goalsMap.set(tg, {id:uid('GOAL'), code:'GL-'+String(++goalOrder).padStart(2,'0'), title:goalDisplay, fullTitle:tg, axisId:axis.id, owner:p.owner||p.sponsor||'', narrative:p.universityGoal||'', order:goalOrder});
    const goal = goalsMap.get(tg);

    const initTitle = (p.initiative||'').trim() || 'مبادرة غير مصنفة';
    if(!initMap.has(initTitle)){
      const kpiNames = (p.kpis||'').split(/[•·]|(?:\s{2,})/).map(s=>s.trim()).filter(Boolean);
      initMap.set(initTitle, {
        id:uid('INIT'), code:'IN-'+String(++initOrder).padStart(3,'0'),
        title:initTitle, axisId:axis.id, goalId:goal.id,
        owner:p.owner||p.sponsor||'', priority:p.priority||'متوسطة', notes:'',
        kpis: kpiNames.length ? kpiNames.map(name=>({id:uid('KPI'), name, target:100, actual:0, unit:'%'})) : [{id:uid('KPI'), name:'نسبة الإنجاز العامة للمبادرة', target:100, actual:0, unit:'%'}],
        startDate:'', endDate:'', createdAt:today(), updatedAt:today()
      });
    }
  });

  projects.forEach(p=>{
    const tg = (p.transformationGoal||'').trim() || 'محاور عامة';
    const axisTitle = tg.includes('—') ? tg.split('—')[0].trim() : tg;
    const axis = axesMap.get(axisTitle);
    const goal = goalsMap.get(tg);
    const initTitle = (p.initiative||'').trim() || 'مبادرة غير مصنفة';
    const init = initMap.get(initTitle);
    p.axisId = axis?.id||''; p.goalId = goal?.id||''; p.initiativeId = init?.id||'';
  });

  initMap.forEach(init=>{
    const ps = projects.filter(p=>p.initiativeId===init.id);
    const prog = computeProgress(ps);
    init.kpis.forEach(k=>{ k.actual = prog; });
    const starts = ps.map(p=>p.startDate).filter(Boolean).sort();
    const ends = ps.map(p=>p.endDate).filter(Boolean).sort();
    init.startDate = starts[0]||''; init.endDate = ends[ends.length-1]||'';
  });

  return {
    plan: { id:'PLAN-MAIN', title:'الخطة التنفيذية لعمادة التعليم الإلكتروني وتقنية المعلومات', period:'2026 - 2028', vision:'ريادة رقمية داعمة للتحول المؤسسي والتعليمي لجامعة الطائف', updatedAt: today() },
    axes: [...axesMap.values()].sort((a,b)=>a.order-b.order),
    goals: [...goalsMap.values()].sort((a,b)=>a.order-b.order),
    initiatives: [...initMap.values()].sort((a,b)=>a.code.localeCompare(b.code))
  };
}
function axisById(id){ return (state.axes||[]).find(a=>a.id===id); }
function goalById(id){ return (state.goals||[]).find(g=>g.id===id); }
function initiativeById(id){ return (state.initiatives||[]).find(i=>i.id===id); }
function budgetSum(ps, field){ return ps.reduce((a,p)=>a+Number(p[field]||0),0); }
function initiativeStats(init){
  const ps = state.projects.filter(p=>p.initiativeId===init.id);
  const progress = computeProgress(ps);
  const late = ps.filter(p=>overallStatus(p).cls==='red').length;
  const watch = ps.filter(p=>overallStatus(p).cls==='amber').length;
  const completed = ps.filter(p=>Number(p.currentCompletion||0)>=100).length;
  let status = 'قيد التنفيذ';
  if(!ps.length) status = 'بدون مشاريع';
  else if(completed===ps.length) status = 'مكتملة';
  else if(late>0) status = 'متأخرة';
  else if(!ps.some(p=>Number(p.currentCompletion||0)>0)) status = 'لم تبدأ';
  const starts = ps.map(p=>p.startDate).filter(Boolean).sort();
  const ends = ps.map(p=>p.endDate).filter(Boolean).sort();
  return {
    projects:ps, progress, late, watch, completed, status,
    budget: budgetSum(ps,'allocatedBudget'), spend: budgetSum(ps,'actualSpend'), planned: budgetSum(ps,'plannedSpend'),
    start: init.startDate||starts[0], end: init.endDate||ends[ends.length-1]
  };
}
function goalStats(goal){
  const inits = state.initiatives.filter(i=>i.goalId===goal.id);
  const ps = state.projects.filter(p=>p.goalId===goal.id);
  return { initiatives:inits, projects:ps, progress:computeProgress(ps), budget:budgetSum(ps,'allocatedBudget'), spend:budgetSum(ps,'actualSpend') };
}
function axisStats(axis){
  const goals = state.goals.filter(g=>g.axisId===axis.id);
  const ps = state.projects.filter(p=>p.axisId===axis.id);
  return { goals, projects:ps, progress:computeProgress(ps), budget:budgetSum(ps,'allocatedBudget'), spend:budgetSum(ps,'actualSpend') };
}
function planStats(){
  const ps = state.projects;
  return { progress:computeProgress(ps), budget:budgetSum(ps,'allocatedBudget'), spend:budgetSum(ps,'actualSpend'), planned:budgetSum(ps,'plannedSpend') };
}

let state = loadState();
function loadState(){
  try{
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if(raw && raw.projects){
      if(!raw.initiatives || !raw.axes || !raw.goals || !raw.plan){
        const strat = buildStrategy(raw.projects);
        raw.plan = raw.plan || strat.plan;
        raw.axes = raw.axes || strat.axes;
        raw.goals = raw.goals || strat.goals;
        raw.initiatives = raw.initiatives || strat.initiatives;
      }
      if(!raw.finance){
        raw.finance = buildDefaultFinance(raw.projects);
      }
      if(!raw.accounting){
        raw.accounting = buildDefaultAccounting(raw.projects, raw.finance);
      }
      if(raw.accounting && !raw.accounting.accounts.some(a=>a.code==='2030')){
        const liabHeader = raw.accounting.accounts.find(a=>a.code==='2000');
        raw.accounting.accounts.push({id:uid('ACC'), code:'2030', name:'استقطاعات وموظفين مستحقة', type:'خصوم', parentId: liabHeader?liabHeader.id:'', isPostable:true});
      }
      if(!raw.hr){
        raw.hr = buildDefaultHR(raw.projects);
        const paidRun = raw.hr.payrollRuns.find(r=>r.status==='مصروف');
        if(paidRun) raw.accounting.journalEntries.push(buildPayrollJournalEntry(paidRun, raw.accounting.accounts));
      }
      return raw;
    }
  }catch(e){}
  return defaultState();
}
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let currentPage = location.hash.replace('#','') || 'planDashboard';
let currentProjectId = null;

function go(p, id){
  currentPage = p; currentProjectId = id || null;
  location.hash = p;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('app')?.focus();
}

/* ================= MODULE BAR & SIDEBAR NAV ================= */
function renderModuleBar(){
  document.getElementById('moduleBar').innerHTML = MODULES.map(m=>`
    <button class="module-btn ${currentModule===m.id?'active':''}" onclick="switchModule('${m.id}')">
      <span class="ico">${m.ico}</span> ${esc(t(m.label))}
    </button>`).join('');
}

  const nav = document.getElementById('navArea');
  if(currentModule==='finance'){
    nav.innerHTML = `
    <div class="section-label">الرئيسية</div>

/* ---------------- helpers on projects ---------------- */
function projectById(id){ return state.projects.find(p=>p.id===id); }
function ragClass(r){ return r==='على المسار'?'green':r==='متأخر'?'red':'amber'; }
function overallStatus(p){
  if(p.phase===PHASES[3] && p.currentCompletion>=100) return {label:'مكتمل',cls:'blue'};
  if(!p.currentCompletion && p.phase===PHASES[0]) return {label:'لم يبدأ',cls:'gray'};
  return {label:p.ragOverall,cls:ragClass(p.ragOverall)};
}
function budgetVariance(p){ return (Number(p.allocatedBudget||0) - Number(p.actualSpend||0)); }
function scheduleVarianceDays(p){ const d=daysBetween(p.endDate,p.estimatedEndDate); return d===null?0:d; }

function head(eyebrow,title,desc,actions){
  return `<div class="head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions||''}</div></div>`;
}
function statusBadge(label,cls){ return `<span class="status ${cls}"><span class="dot"></span>${esc(label)}</span>`; }

/* ================= DASHBOARD ================= */
function pageDashboard(){
  const ps = state.projects;
  const total = ps.length;
  const onTrack = ps.filter(p=>overallStatus(p).cls==='green').length;
  const watch = ps.filter(p=>overallStatus(p).cls==='amber').length;
  const late = ps.filter(p=>overallStatus(p).cls==='red').length;
  const done = ps.filter(p=>overallStatus(p).cls==='blue').length;
  const totalBudget = ps.reduce((a,p)=>a+Number(p.allocatedBudget||0),0);
  const totalSpend = ps.reduce((a,p)=>a+Number(p.actualSpend||0),0);
  const avg = ps.length? Math.round(ps.reduce((a,p)=>a+Number(p.currentCompletion||0),0)/ps.length) : 0;

  return head(t('نظرة عامة'), t('لوحة التحكم التنفيذية'), t('متابعة محفظة المشاريع، الجدول الزمني، الميزانية، والمخاطر في مكان واحد.'),

    <div class="card kpi-card"><small>${t('يحتاج متابعة / متأخر')}</small><b>${watch+late}</b><em>${late} ${t('متأخر')} · ${watch} ${t('يحتاج متابعة')}</em></div>
    <div class="card kpi-card"><small>${t('متوسط نسبة الإنجاز')}</small><b>${avg}%</b><em>${t('عبر جميع المشاريع')}</em></div>

  <div class="two">

      <div class="three">
        <div class="stat-box"><small>${t('على المسار')}</small><b>${onTrack}</b></div>
        <div class="stat-box"><small>${t('يحتاج متابعة')}</small><b>${watch}</b></div>
        <div class="stat-box"><small>${t('متأخر')}</small><b>${late}</b></div>
      </div>
      <div class="three" style="margin-top:10px">
        <div class="stat-box"><small>${t('مكتمل')}</small><b>${done}</b></div>
        <div class="stat-box"><small>${t('إجمالي الميزانية المعتمدة')}</small><b style="font-size:14px">${fmtMoney(totalBudget)}</b></div>
        <div class="stat-box"><small>${t('إجمالي الصرف الفعلي')}</small><b style="font-size:14px">${fmtMoney(totalSpend)}</b></div>
      </div>
    </section>
    <section class="card">
      <div class="title"><h2>${t('أعلى 5 مشاريع من حيث الصرف')}</h2></div>
      ${[...ps].sort((a,b)=>(b.actualSpend||0)-(a.actualSpend||0)).slice(0,5).map(p=>{
        const pct = p.allocatedBudget? Math.min(100,Math.round((p.actualSpend/p.allocatedBudget)*100)) : 0;

function projectRows(arr){
  return arr.map(p=>{const st=overallStatus(p);return `<tr>
    <td><button class="link" onclick="go('projectDetail','${p.id}')">${esc(p.nameAr)}</button><div class="muted small">${esc(p.code)}</div></td>
    <td>${esc(p.manager||'—')}</td>
    <td class="small">${esc(p.phase)}</td>
    <td class="small">${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}</td>
    <td><div class="progress-row" style="min-width:130px"><div class="bar"><span style="width:${p.currentCompletion||0}%"></span></div><small>${p.currentCompletion||0}%</small></div></td>
    <td>${statusBadge(t(st.label),st.cls)}</td>
    <td><button class="link" onclick="go('projectDetail','${p.id}')">${t('فتح')}</button></td>
  </tr>`}).join('') || `<tr><td colspan="7"><div class="empty">${t('لا توجد مشاريع مطابقة.')}</div></td></tr>`;
}
function filterProjects(){
  const q=(document.getElementById('pq').value||'').trim();
  const f=document.getElementById('pf').value;
  const arr = state.projects.filter(p=>{
    const matchQ = !q || (p.nameAr+' '+p.code+' '+(p.nameEn||'')).includes(q);
    const st = overallStatus(p);
    const matchF = f==='الكل' || st.label===f;
    return matchQ && matchF;
  });
  document.getElementById('ptbody').innerHTML = projectRows(arr);
}

function submitProject(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  ['allocatedBudget','actualSpend','plannedSpend','prevCompletion','currentCompletion','plannedCompletion'].forEach(k=>data[k]=Number(data[k]||0));
  const linkedInit = data.initiativeId ? initiativeById(data.initiativeId) : null;
  data.initiative = linkedInit ? linkedInit.title : '';
  data.axisId = linkedInit ? linkedInit.axisId : '';
  data.goalId = linkedInit ? linkedInit.goalId : '';
  if(id){
    const p = projectById(id);
    Object.assign(p, data); p.updatedAt = today();
    notify('تم تحديث المشروع', `تم تحديث بيانات "${p.nameAr}".`);
  } else {
    const p = Object.assign({id:uid('PRJ'), milestones:[], tasks:[], reportsLog:[], createdAt:today(), updatedAt:today()}, data);
    state.projects.unshift(p);
    notify('تمت إضافة مشروع جديد', `تمت إضافة "${p.nameAr}" إلى المحفظة.`);
  }
  save(); closeModal();
  toast('تم حفظ بيانات المشروع بنجاح');
  render();
}

  state.projects = state.projects.filter(p=>p.id!==id);

}

function ganttHtml(p){
  const tasks = p.tasks||[];
  if(!tasks.length) return `<div class="empty">${t('لا توجد مهام مضافة لهذا المشروع.')}</div>`;
  const starts = tasks.map(t=>new Date(t.start).getTime()).filter(Boolean);
  const ends = tasks.map(t=>new Date(t.due).getTime()).filter(Boolean);
  const minD = Math.min(...starts, new Date(p.startDate||today()).getTime());
  const maxD = Math.max(...ends, new Date(p.endDate||today()).getTime());
  const span = Math.max(1, maxD-minD);
  const todayPct = Math.min(100, Math.max(0, ((Date.now()-minD)/span)*100));
  return `<div class="gt-header"><div>المهمة</div><div>الجدول الزمني (${fmtDate(p.startDate)} → ${fmtDate(p.endDate)})</div></div>
  ${tasks.map(t=>{
    const s = new Date(t.start).getTime(), e = new Date(t.due).getTime();
    const left = Math.max(0, ((s-minD)/span)*100);
    const width = Math.max(1.5, ((e-s)/span)*100);
    const isLate = (t.pct<100 && e < Date.now());
    return `<div class="gantt-row">
      <div class="gt-label"><b>${esc(t.taskId)} — ${esc(t.title)}</b><small>${esc(t.owner||'')} · ${t.duration||daysBetween(t.start,t.due)||0} يوم</small></div>
      <div class="gt-track">
        <div class="gt-bar ${isLate?'late':''}" style="right:${left}%;width:${width}%">
          <div class="gt-fill" style="width:${100-(t.pct||0)}%"></div>
        </div>
      </div>
    </div>`;
  }).join('')}
  <div class="small muted" style="margin-top:8px">النسبة الملوّنة الداكنة داخل كل شريط تمثل الجزء المتبقي من المهمة. الأشرطة الحمراء تشير إلى مهام متأخرة عن موعدها.</div>`;
}

function parseLineItems(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split(/[|\-–]/).map(s=>s.trim());
    const description = parts[0] || line;
    const qty = Number(parts[1]||1) || 1;
    const unitPrice = Number(parts[2]||0) || 0;
    return {id:uid('ITM'), description, qty, unitPrice};
  });
}
function itemsToText(items){ return (items||[]).map(it=>`${it.description} - ${it.qty} - ${it.unitPrice}`).join('\n'); }
function itemsTotal(items){ return (items||[]).reduce((a,it)=>a+Number(it.qty||0)*Number(it.unitPrice||0),0); }

function buildDefaultFinance(projects){
  const vendorNames = [
    {name:'شركة الحلول الرقمية المتقدمة', category:'برمجيات وتراخيص'},
    {name:'شركة الشبكات والبنية التحتية الذكية', category:'بنية تحتية وشبكات'},
    {name:'شركة السحابة العربية لتقنية المعلومات', category:'خدمات سحابية'},
    {name:'المجموعة السعودية للأمن السيبراني', category:'أمن سيبراني'},
    {name:'شركة المعرفة للتدريب والاستشارات التقنية', category:'تدريب واستشارات'},
    {name:'شركة النظم المتكاملة للأجهزة والمعدات', category:'أجهزة ومعدات'},
    {name:'شركة آفاق البيانات لحلول الأعمال', category:'برمجيات وتراخيص'},
    {name:'شركة الاتصالات المتقدمة والبنية الرقمية', category:'بنية تحتية وشبكات'},
  ];
  const vendors = vendorNames.map((v,idx)=>{
    const code = 'VEN-'+String(idx+1).padStart(3,'0');
    return {
      id:uid('VEN'), code, name:v.name, category:v.category,
      crNumber:String(4010000000+idx*137), contactPerson:'ممثل خدمة العملاء', phone:'011'+String(4500000+idx*111),
      email:`contact${idx+1}@${code.toLowerCase().replace('-','')}.sa`, status:'نشط', rating: 3+(idx%3), notes:''
    };
  });

  const candidates = [...projects].filter(p=>Number(p.allocatedBudget||0)>0).sort((a,b)=>Number(b.allocatedBudget||0)-Number(a.allocatedBudget||0)).slice(0,14);
  const contracts=[], purchaseRequests=[], purchaseOrders=[], paymentOrders=[];
  let prN=0, poN=0, ctN=0, payN=0;

  candidates.forEach((p,idx)=>{
    const vendor = vendors[idx % vendors.length];
    const year = (p.startDate||'2026').slice(0,4);
    const prAmount = Math.round(Number(p.allocatedBudget||0) * 0.25);
    const items = [{id:uid('ITM'), description:`تنفيذ المرحلة الأولى — ${p.nameAr}`, qty:1, unitPrice:prAmount}];
    const prStatus = idx%9===8 ? 'مرفوض' : (idx%6===5 ? 'قيد الاعتماد' : 'معتمد');
    const pr = {
      id:uid('PR'), code:`PR-${year}-${String(++prN).padStart(3,'0')}`, projectId:p.id,
      requestedBy: p.manager || 'منسق المشروع', department: p.owner || 'عمادة التعليم الإلكتروني وتقنية المعلومات',
      date: p.startDate || today(), items, status: prStatus, notes:'', createdAt: p.startDate||today()
    };
    purchaseRequests.push(pr);

    if(prStatus==='معتمد'){
      const poStatusPool = ['مفتوح','مستلم جزئياً','مستلم بالكامل'];
      const poStatus = poStatusPool[idx % poStatusPool.length];
      const po = {
        id:uid('PO'), code:`PO-${year}-${String(++poN).padStart(3,'0')}`, prId:pr.id, projectId:p.id, vendorId:vendor.id, contractId:'',
        date: pr.date, items: JSON.parse(JSON.stringify(items)), status: poStatus, notes:''
      };
      purchaseOrders.push(po);
      const total = itemsTotal(po.items);
      const payStatus = (poStatus==='مستلم بالكامل'||poStatus==='مستلم جزئياً') ? 'مصروف' : 'معلق';
      const payAmount = poStatus==='مستلم بالكامل' ? total : (poStatus==='مستلم جزئياً' ? Math.round(total*0.5) : Math.round(total*0.3));
      paymentOrders.push({
        id:uid('PAY'), code:`PAY-${year}-${String(++payN).padStart(3,'0')}`, poId:po.id, vendorId:vendor.id, projectId:p.id,
        amount: payAmount, date: po.date, status: payStatus, method: PAYMENT_METHODS[idx%PAYMENT_METHODS.length],
        bankRef: payStatus==='مصروف' ? ('TRX-'+(100000+idx*37)) : '', notes:''
      });
    }
    if(idx%2===0){
      contracts.push({
        id:uid('CT'), code:`CT-${year}-${String(++ctN).padStart(3,'0')}`, vendorId:vendor.id, projectId:p.id,
        title:`عقد تنفيذ — ${p.nameAr}`, amount:Number(p.allocatedBudget||0),
        startDate:p.startDate||today(), endDate:p.endDate||'', status:'ساري', paymentTerms:'دفعات مرتبطة بإنجاز مخرجات المشروع', notes:''
      });
    }
  });
  return { vendors, contracts, purchaseRequests, purchaseOrders, paymentOrders };
}

function vendorById(id){ return (state.finance.vendors||[]).find(v=>v.id===id); }
function contractById(id){ return (state.finance.contracts||[]).find(c=>c.id===id); }
function prById(id){ return (state.finance.purchaseRequests||[]).find(x=>x.id===id); }
function poById(id){ return (state.finance.purchaseOrders||[]).find(x=>x.id===id); }
function paymentById(id){ return (state.finance.paymentOrders||[]).find(x=>x.id===id); }
function poPaidAmount(poId){ return (state.finance.paymentOrders||[]).filter(pay=>pay.poId===poId && pay.status==='مصروف').reduce((a,pay)=>a+Number(pay.amount||0),0); }
function poTotal(po){ return itemsTotal(po.items); }
function prTotal(pr){ return itemsTotal(pr.items); }
function prStatusCls(s){ return s==='معتمد'?'green':s==='مرفوض'?'red':s==='قيد الاعتماد'?'amber':'gray'; }
function poStatusCls(s){ return s==='مستلم بالكامل'?'blue':s==='مستلم جزئياً'?'amber':s==='ملغى'?'red':'gray'; }
function paymentStatusCls(s){ return s==='مصروف'?'green':'amber'; }
function contractStatusCls(s){ return s==='ساري'?'green':s==='منتهي'?'gray':'red'; }

function financeStats(){
  const F = state.finance;
  const pl = planStats();
  const spentViaPayments = (F.paymentOrders||[]).filter(p=>p.status==='مصروف').reduce((a,p)=>a+Number(p.amount||0),0);
  const encumbrance = (F.purchaseOrders||[]).filter(po=>po.status!=='ملغى').reduce((a,po)=>a+Math.max(0, poTotal(po)-poPaidAmount(po.id)),0);
  const pendingPRs = (F.purchaseRequests||[]).filter(pr=>pr.status==='قيد الاعتماد').length;
  const openPOs = (F.purchaseOrders||[]).filter(po=>po.status==='مفتوح'||po.status==='مستلم جزئياً').length;
  const activeContracts = (F.contracts||[]).filter(c=>c.status==='ساري').length;
  return { allocated: pl.budget, spend: pl.spend, spentViaPayments, encumbrance, available: pl.budget-pl.spend-encumbrance, pendingPRs, openPOs, activeContracts };
}

function applyPaymentBudgetDelta(pay, prevStatus, prevAmount){
  const wasSpent = prevStatus==='مصروف' ? Number(prevAmount||0) : 0;
  const nowSpent = pay.status==='مصروف' ? Number(pay.amount||0) : 0;
  const delta = nowSpent - wasSpent;
  if(delta!==0 && pay.projectId){
    const p = projectById(pay.projectId);
    if(p){ p.actualSpend = Math.max(0, Number(p.actualSpend||0) + delta); p.updatedAt = today(); }
  }
}

  state.finance.purchaseRequests.forEach(pr=>{const p=projectById(pr.projectId);rows.push(['طلب شراء',pr.code,pr.department||'',p?.nameAr||'',prTotal(pr),pr.status,pr.date||'']);});
  state.finance.purchaseOrders.forEach(po=>{const v=vendorById(po.vendorId);const p=projectById(po.projectId);rows.push(['أمر شراء',po.code,v?.name||'',p?.nameAr||'',poTotal(po),po.status,po.date||'']);});
  state.finance.paymentOrders.forEach(pay=>{const v=vendorById(pay.vendorId);const p=projectById(pay.projectId);rows.push(['أمر صرف',pay.code,v?.name||'',p?.nameAr||'',pay.amount,pay.status,pay.date||'']);});
  state.finance.contracts.forEach(c=>{const v=vendorById(c.vendorId);const p=projectById(c.projectId);rows.push(['عقد',c.code,v?.name||'',p?.nameAr||'',c.amount,c.status,c.startDate||'']);});
  const csv = '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `finance-register-${today()}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('تم تجهيز سجل المشتريات بصيغة CSV');
}

function buildDefaultAccounts(){
  const A = (code,name,type,parentCode,postable)=>({id:uid('ACC'), code, name, type, parentCode, isPostable:postable});
  const list = [
    A('1000','الأصول','أصول',null,false),
    A('1010','البنك - الحساب الجاري','أصول','1000',true),
    A('1020','النقدية بالصندوق','أصول','1000',true),
    A('1030','ذمم مدينة','أصول','1000',true),
    A('2000','الخصوم','خصوم',null,false),
    A('2010','الدائنون - موردون','خصوم','2000',true),
    A('2020','مصروفات مستحقة','خصوم','2000',true),
    A('2030','استقطاعات وموظفين مستحقة','خصوم','2000',true),
    A('3000','حقوق الملكية وصافي الأصول','حقوق ملكية',null,false),
    A('3010','صافي الأصول المتراكم','حقوق ملكية','3000',true),
    A('4000','الإيرادات','إيرادات',null,false),
    A('4010','اعتمادات الميزانية الحكومية','إيرادات','4000',true),
    A('4020','إيرادات أخرى','إيرادات','4000',true),
    A('5000','المصروفات','مصروفات',null,false),
    A('5010','رواتب وأجور','مصروفات','5000',true),
    A('5020','مصروفات تشغيلية عامة','مصروفات','5000',true),
    A('5030','مصروفات المشتريات والتنفيذ','مصروفات','5000',true),
    A('5040','صيانة وتشغيل','مصروفات','5000',true),
    A('5050','تدريب واستشارات','مصروفات','5000',true),

  list.forEach(a=>{ a.parentId = a.parentCode ? (list.find(x=>x.code===a.parentCode)?.id||'') : ''; delete a.parentCode; });

function buildDefaultAccounting(projects, finance){
  const accounts = buildDefaultAccounts();
  const accByCode = code => accounts.find(a=>a.code===code);
  const totalBudget = projects.reduce((a,p)=>a+Number(p.allocatedBudget||0),0);
  const earliestDate = projects.map(p=>p.startDate).filter(Boolean).sort()[0] || today();
  const year = earliestDate.slice(0,4);
  const journalEntries = [];
  let jeN = 0;
  const mkCode = ()=>`JE-${year}-${String(++jeN).padStart(3,'0')}`;

  journalEntries.push({
    id:uid('JE'), code:mkCode(), date:earliestDate, description:'قيد افتتاحي - اعتماد الميزانية السنوية المعتمدة لعمادة التعليم الإلكتروني وتقنية المعلومات',
    reference:'اعتماد ميزانية', status:'مرحّل', createdAt: earliestDate,
    lines:[
      {id:uid('JL'), accountId:accByCode('1010').id, debit: totalBudget, credit:0, description:'استلام الاعتماد في الحساب الجاري'},
      {id:uid('JL'), accountId:accByCode('4010').id, debit:0, credit: totalBudget, description:'اعتماد الميزانية الحكومية للسنة المالية'},
    ]
  });
  (finance.paymentOrders||[]).filter(pay=>pay.status==='مصروف').sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(pay=>{
    const proj = projects.find(p=>p.id===pay.projectId);
    const vendor = (finance.vendors||[]).find(v=>v.id===pay.vendorId);
    journalEntries.push({
      id:uid('JE'), code:mkCode(), date: pay.date||today(),
      description:`صرف دفعة إلى ${vendor?vendor.name:'مورد'}${proj?' — '+proj.nameAr:''}`,
      reference:`أمر صرف ${pay.code}`, status:'مرحّل', createdAt: pay.date||today(),
      lines:[
        {id:uid('JL'), accountId:accByCode('5030').id, debit: Number(pay.amount||0), credit:0, description:'مصروفات تنفيذ مشروع'},
        {id:uid('JL'), accountId:accByCode('1010').id, debit:0, credit: Number(pay.amount||0), description:'صرف من الحساب الجاري'},
      ]
    });
  });
  journalEntries.push({
    id:uid('JE'), code:mkCode(), date:earliestDate, description:'استحقاق رواتب وأجور فريق العمادة عن الفترة الحالية',
    reference:'رواتب', status:'مرحّل', createdAt:earliestDate,
    lines:[
      {id:uid('JL'), accountId:accByCode('5010').id, debit: Math.round(totalBudget*0.015), credit:0, description:'رواتب وأجور'},
      {id:uid('JL'), accountId:accByCode('1010').id, debit:0, credit: Math.round(totalBudget*0.015), description:'صرف رواتب من الحساب الجاري'},
    ]
  });
  journalEntries.push({
    id:uid('JE'), code:mkCode(), date:earliestDate, description:'مصروفات تشغيلية عامة (اتصالات، قرطاسية، صيانة مكتبية)',
    reference:'تشغيلي', status:'مرحّل', createdAt:earliestDate,
    lines:[
      {id:uid('JL'), accountId:accByCode('5020').id, debit: Math.round(totalBudget*0.004), credit:0, description:'مصروفات تشغيلية'},
      {id:uid('JL'), accountId:accByCode('1010').id, debit:0, credit: Math.round(totalBudget*0.004), description:'صرف من الحساب الجاري'},
    ]
  });

  const accounting = { accounts, journalEntries, reconciliations: [], auditFindings: [] };

  const bankAccId = accByCode('1010').id;
  const bankBalance = journalEntries.filter(je=>je.status==='مرحّل').reduce((a,je)=>{
    const line = je.lines.find(l=>l.accountId===bankAccId);
    return line ? a + Number(line.debit||0) - Number(line.credit||0) : a;
  },0);
  accounting.reconciliations.push({
    id:uid('REC'), code:`REC-${year}-001`, statementDate: today(), bankStatementBalance: Math.round(bankBalance - 32000),
    items:[{id:uid('RI'), description:'شيك صادر لمورد لم يُصرف بعد بالبنك', amount:32000, type:'شيك لم يُصرف بعد'}],
    notes:'', createdAt: today()
  });

  let auN = 0;
  const mkAuCode = ()=>`AUD-${year}-${String(++auN).padStart(3,'0')}`;
  const overBudget = projects.filter(p=>Number(p.allocatedBudget||0)>0 && Number(p.actualSpend||0)>Number(p.allocatedBudget||0));
  overBudget.slice(0,3).forEach(p=>{
    const over = Number(p.actualSpend||0)-Number(p.allocatedBudget||0);
    accounting.auditFindings.push({
      id:uid('AUD'), code:mkAuCode(), title:`تجاوز في الصرف الفعلي لمشروع: ${p.nameAr}`,
      area:'الموازنة والصرف', severity: over>100000?'عالية':'متوسطة',
      findingDate: today(), description:`تم رصد تجاوز في الصرف الفعلي عن الميزانية المعتمدة للمشروع بمبلغ ${fmtMoney(over)}.`,
      recommendation:'مراجعة أسباب التجاوز مع مدير المشروع، واعتماد تمويل إضافي أو إعادة جدولة الأنشطة المتبقية.',
      status:'مفتوحة', responsibleParty: p.owner||'', dueDate:'', projectId:p.id
    });
  });
  accounting.auditFindings.push({
    id:uid('AUD'), code:mkAuCode(), title:'ضرورة توثيق محاضر استلام أوامر الشراء المكتملة',
    area:'المشتريات والعقود', severity:'منخفضة', findingDate: today(),
    description:'لوحظ عدم اكتمال بعض محاضر الاستلام لأوامر الشراء التي حالتها مستلمة بالكامل.',
    recommendation:'إلزام مسؤولي المشتريات برفع محضر استلام موقّع مع كل أمر شراء يتم إغلاقه.',
    status:'قيد المعالجة', responsibleParty:'إدارة المشتريات', dueDate:'', projectId:''
  });

  return accounting;
}

function isDebitNormal(type){ return type==='أصول' || type==='مصروفات'; }
function accById(id){ return (state.accounting.accounts||[]).find(a=>a.id===id); }
function accByCodeRT(code){ return (state.accounting.accounts||[]).find(a=>a.code===code); }
function childAccounts(id){ return state.accounting.accounts.filter(a=>a.parentId===id); }
function jeById(id){ return (state.accounting.journalEntries||[]).find(j=>j.id===id); }
function jeLines(accountId){
  const out=[];
  state.accounting.journalEntries.filter(j=>j.status==='مرحّل').forEach(j=>{
    j.lines.filter(l=>l.accountId===accountId).forEach(l=>out.push({...l, date:j.date, jeId:j.id, jeCode:j.code, jeDescription:j.description}));
  });
  return out.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
}
function accountBalance(account){
  const lines = jeLines(account.id);
  const debit = lines.reduce((a,l)=>a+Number(l.debit||0),0);
  const credit = lines.reduce((a,l)=>a+Number(l.credit||0),0);
  return isDebitNormal(account.type) ? debit-credit : credit-debit;
}
function accountTotalBalance(account){
  if(account.isPostable) return accountBalance(account);
  return childAccounts(account.id).reduce((a,c)=>a+accountTotalBalance(c),0);
}
function sumByType(type){
  return state.accounting.accounts.filter(a=>!a.parentId && a.type===type).reduce((a,acc)=>a+accountTotalBalance(acc),0);
}
function trialBalanceRows(){
  return state.accounting.accounts.filter(a=>a.isPostable).map(a=>{
    const bal = accountBalance(a);
    let debit=0, credit=0;
    if(isDebitNormal(a.type)){ if(bal>=0) debit=bal; else credit=-bal; }
    else { if(bal>=0) credit=bal; else debit=-bal; }
    return {account:a, debit, credit, balance:bal};
  });
}

/* ---- Journal Entries ---- */
function parseJournalLines(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split('|').map(s=>s.trim());
    const code = parts[0]||'';
    const debit = Number(parts[1]||0)||0;
    const credit = Number(parts[2]||0)||0;
    const description = parts[3]||'';
    const acc = accByCodeRT(code);
    return {id:uid('JL'), accountId: acc?acc.id:'', accountCode:code, debit, credit, description};
  });
}
function linesToText(je){
  return (je.lines||[]).map(l=>{ const a=accById(l.accountId); return `${a?a.code:(l.accountCode||'')} | ${l.debit||0} | ${l.credit||0} | ${l.description||''}`; }).join('\n');
}
function openJournalForm(id){

    </div>
  </form>`);
}
function submitJournal(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  const lines = parseJournalLines(data.linesText); delete data.linesText;
  const totalDebit = lines.reduce((a,l)=>a+Number(l.debit||0),0);
  const totalCredit = lines.reduce((a,l)=>a+Number(l.credit||0),0);
  const unresolved = lines.filter(l=>!l.accountId);
  if(unresolved.length){ alert('يوجد بنود برمز حساب غير معروف: '+unresolved.map(l=>l.accountCode).join('، ')); return; }
  if(lines.length<2){ alert('يجب إدخال بندين على الأقل للقيد.'); return; }
  if(Math.round(totalDebit*100)!==Math.round(totalCredit*100)){ alert(`القيد غير متزن: إجمالي المدين ${totalDebit} لا يساوي إجمالي الدائن ${totalCredit}.`); return; }
  if(id){
    const je = jeById(id); Object.assign(je, data); je.lines = lines;
    toast('تم تحديث القيد');
  } else {
    const year = (data.date||today()).slice(0,4);
    const je = Object.assign({id:uid('JE'), code:`JE-${year}-${String(state.accounting.journalEntries.length+1).padStart(3,'0')}`, status:'مسودة', createdAt:today()}, data, {lines});
    state.accounting.journalEntries.push(je);
    toast('تم إنشاء القيد كمسودة');
  }
  save(); closeModal(); render();
}
function postJournal(id){ const je = jeById(id); if(!je) return; je.status='مرحّل'; save(); toast('تم ترحيل القيد'); render(); }
function deleteJournalDraft(id){
  const je = jeById(id); if(!je) return;
  if(je.status==='مرحّل'){ alert('لا يمكن حذف قيد مُرحّل، استخدم "عكس القيد" بدلاً من ذلك.'); return; }
  if(!confirm('حذف هذا القيد؟')) return;
  state.accounting.journalEntries = state.accounting.journalEntries.filter(j=>j.id!==id);
  save(); toast('تم حذف المسودة'); go('journalEntries');
}
function reverseJournal(id){
  const je = jeById(id); if(!je) return;
  if(!confirm('سيتم إنشاء قيد عكسي جديد بنفس القيمة بعكس أطراف المدين والدائن. متابعة؟')) return;
  const year = today().slice(0,4);
  const rev = {
    id:uid('JE'), code:`JE-${year}-${String(state.accounting.journalEntries.length+1).padStart(3,'0')}`,
    date:today(), description:`عكس قيد ${je.code} — ${je.description}`, reference:`عكس ${je.code}`, status:'مرحّل', createdAt:today(),
    lines: je.lines.map(l=>({id:uid('JL'), accountId:l.accountId, debit:Number(l.credit||0), credit:Number(l.debit||0), description:l.description}))
  };
  state.accounting.journalEntries.push(rev);

/* ---- Bank Reconciliation ---- */
function parseReconItems(text){
  return String(text||'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const parts = line.split('|').map(s=>s.trim());
    return {id:uid('RI'), description:parts[0]||line, amount:Number(parts[1]||0)||0, type: RECON_ITEM_TYPES.includes(parts[2])?parts[2]:RECON_ITEM_TYPES[0]};
  });
}
function openReconForm(){
  showModal('مطابقة بنكية جديدة', `
  <form onsubmit="submitRecon(event)">
    <div class="form-grid">
      <div class="field"><label>تاريخ كشف الحساب</label><input type="date" name="statementDate" value="${today()}"></div>
      <div class="field"><label>رصيد كشف الحساب البنكي (ر.س)</label><input type="number" name="bankStatementBalance" required></div>
      <div class="field full"><label>البنود المعلّقة (سطر لكل بند: الوصف | المبلغ | النوع) — النوع: ${RECON_ITEM_TYPES.join(' / ')}</label><textarea name="itemsText" rows="4" placeholder="شيك صادر لمورد س | 15000 | شيك لم يُصرف بعد"></textarea></div>
      <div class="field full"><label>ملاحظات</label><textarea name="notes"></textarea></div>
    </div>
    <div class="form-actions">
      <button type="submit" class="btn">حفظ المطابقة</button>
      <button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button>
    </div>
  </form>`);
}
function submitRecon(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  const items = parseReconItems(data.itemsText); delete data.itemsText;
  data.bankStatementBalance = Number(data.bankStatementBalance||0);
  const year = (data.statementDate||today()).slice(0,4);
  const r = Object.assign({id:uid('REC'), code:`REC-${year}-${String(state.accounting.reconciliations.length+1).padStart(3,'0')}`, createdAt:today()}, data, {items});
  state.accounting.reconciliations.push(r);
  save(); closeModal(); toast('تم حفظ المطابقة البنكية'); render();
}
function pageBankReconciliation(){
  const bankAcc = accByCodeRT('1010');
  const bookBalance = accountBalance(bankAcc);
  const list = [...state.accounting.reconciliations].sort((a,b)=>(b.statementDate||'').localeCompare(a.statementDate||''));
  return head('النظام الرقابي والمحاسبي','المطابقة البنكية','مطابقة الرصيد الدفتري لحساب البنك مع كشف الحساب البنكي الفعلي بشكل دوري.',
    `<button class="btn" onclick="openReconForm()">+ مطابقة جديدة</button>`) +
  `<div class="grid" style="margin-bottom:15px"><div class="card kpi-card"><small>الرصيد الدفتري الحالي (1010)</small><b style="font-size:18px">${fmtMoney(bookBalance)}</b></div></div>
  <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>الرمز</th><th>تاريخ الكشف</th><th>رصيد البنك</th><th>الرصيد الدفتري</th><th>الفرق</th><th>الحالة</th><th></th></tr></thead>
  <tbody>${list.map(r=>{
    const dep = r.items.filter(i=>i.type==='إيداع لم يظهر بالبنك').reduce((a,i)=>a+Number(i.amount||0),0);
    const chk = r.items.filter(i=>i.type==='شيك لم يُصرف بعد').reduce((a,i)=>a+Number(i.amount||0),0);
    const reconciled = Number(r.bankStatementBalance||0) + dep - chk;
    const variance = reconciled - bookBalance;
    const status = Math.round(variance)===0 ? 'مطابقة' : 'غير مطابقة';
    return `<tr>
      <td>${esc(r.code)}</td><td>${fmtDate(r.statementDate)}</td><td>${fmtMoney(r.bankStatementBalance)}</td><td>${fmtMoney(bookBalance)}</td>
      <td>${fmtMoney(variance)}</td><td>${statusBadge(status, status==='مطابقة'?'green':'amber')}</td>
      <td><button class="btn sm ghost" onclick="go('reconciliationDetail','${r.id}')">فتح</button></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7"><div class="empty">لا توجد مطابقات بعد.</div></td></tr>`}</tbody></table></div></div>`;
}
function pageReconciliationDetail(id){
  const r = state.accounting.reconciliations.find(x=>x.id===id);
  if(!r) return `<div class="empty"><strong>السجل غير موجود</strong></div>`;
  const bankAcc = accByCodeRT('1010');
  const bookBalance = accountBalance(bankAcc);
  const dep = r.items.filter(i=>i.type==='إيداع لم يظهر بالبنك').reduce((a,i)=>a+Number(i.amount||0),0);
  const chk = r.items.filter(i=>i.type==='شيك لم يُصرف بعد').reduce((a,i)=>a+Number(i.amount||0),0);
  const reconciled = Number(r.bankStatementBalance||0) + dep - chk;
  const variance = reconciled - bookBalance;
  return head(esc(r.code), 'تفاصيل المطابقة البنكية', fmtDate(r.statementDate), `<button class="btn ghost" onclick="go('bankReconciliation')">← العودة للمطابقات</button>`) +

        <div class="stat-box"><small>الفرق بعد التسوية</small><b style="font-size:13px">${fmtMoney(variance)}</b></div>
      </div>
      <div style="margin-top:10px">${statusBadge(Math.round(variance)===0?'مطابقة':'غير مطابقة', Math.round(variance)===0?'green':'amber')}</div>
    </section>
    <section class="card"><div class="title"><h2>ملاحظات</h2></div><p class="small">${esc(r.notes||'لا توجد ملاحظات')}</p></section>

function submitFinding(e,id){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  if(id){
    Object.assign(state.accounting.auditFindings.find(x=>x.id===id), data);
    toast('تم تحديث الملاحظة');
  } else {
    const year = (data.findingDate||today()).slice(0,4);
    const item = Object.assign({id:uid('AUD'), code:`AUD-${year}-${String(state.accounting.auditFindings.length+1).padStart(3,'0')}`, status:'مفتوحة'}, data);
    state.accounting.auditFindings.push(item);
    toast('تمت إضافة الملاحظة');
  }
  save(); closeModal(); render();
}
function setFindingStatus(id,status){
  const f = state.accounting.auditFindings.find(x=>x.id===id); if(!f) return;
  f.status = status; save(); toast('تم تحديث حالة الملاحظة'); render();
}
function generateAutoFindings(){
  const existingProjIds = new Set(state.accounting.auditFindings.map(f=>f.projectId).filter(Boolean));
  const overBudget = state.projects.filter(p=>Number(p.allocatedBudget||0)>0 && Number(p.actualSpend||0)>Number(p.allocatedBudget||0) && !existingProjIds.has(p.id));
  if(!overBudget.length){ toast('لا توجد تجاوزات جديدة غير مسجلة'); return; }
  const year = today().slice(0,4);
  overBudget.forEach(p=>{
    const over = Number(p.actualSpend||0)-Number(p.allocatedBudget||0);
    state.accounting.auditFindings.push({
      id:uid('AUD'), code:`AUD-${year}-${String(state.accounting.auditFindings.length+1).padStart(3,'0')}`,
      title:`تجاوز في الصرف الفعلي لمشروع: ${p.nameAr}`, area:'الموازنة والصرف', severity: over>100000?'عالية':'متوسطة',
      findingDate: today(), description:`تم رصد تجاوز في الصرف الفعلي عن الميزانية المعتمدة للمشروع بمبلغ ${fmtMoney(over)}.`,
      recommendation:'مراجعة أسباب التجاوز مع مدير المشروع، واعتماد تمويل إضافي أو إعادة جدولة الأنشطة المتبقية.',
      status:'مفتوحة', responsibleParty: p.owner||'', dueDate:'', projectId:p.id

}

/* ================= HR MODULE (نظام الموارد البشرية) ================= */
function buildDefaultHR(projects){
  const departments = [
    {id:uid('DEPT'), code:'DEPT-01', name:'الإدارة العامة'},
    {id:uid('DEPT'), code:'DEPT-02', name:'إدارة المشاريع (PMO)'},
    {id:uid('DEPT'), code:'DEPT-03', name:'الشؤون المالية والإدارية'},
    {id:uid('DEPT'), code:'DEPT-04', name:'الدعم الفني والبنية التحتية'},
    {id:uid('DEPT'), code:'DEPT-05', name:'التطوير والأنظمة'},
  ];
  const titlesByDept = {
    'DEPT-01': ['عميد مساعد','مدير مكتب العميد'],
    'DEPT-02': ['مدير مكتب إدارة المشاريع','منسق مشاريع أول','منسق مشاريع','محلل مخاطر'],
    'DEPT-03': ['مدير الشؤون المالية','محاسب أول','أخصائي مشتريات','أخصائي موارد بشرية'],
    'DEPT-04': ['مدير الدعم الفني','مهندس شبكات','أخصائي أمن سيبراني','فني دعم فني'],
    'DEPT-05': ['مدير تطوير الأنظمة','مطور نظم أول','مطور نظم','محلل أعمال'],
  };
  const firstNames = ['محمد','عبدالله','خالد','سعود','فيصل','ناصر','تركي','بندر','منصور','عمر','سلطان','ماجد','ياسر','وليد','فهد'];
  const lastNames = ['القحطاني','الغامدي','الزهراني','العتيبي','الحربي','الشهري','المالكي','السلمي','الثقفي','آل سعيد'];

  let empN = 0;
  const employees = [];
  departments.forEach(d=>{
    (titlesByDept[d.code]||[]).forEach(title=>{
      empN++;
      const basic = 8000 + (title.includes('مدير')||title.includes('عميد')?7000:0) + (title.includes('أول')?2000:0) + (empN%5)*500;
      const housing = Math.round(basic*0.25);
      employees.push({
        id:uid('EMP'), code:'EMP-'+String(empN).padStart(3,'0'),
        name:`${firstNames[empN%firstNames.length]} ${lastNames[empN%lastNames.length]}`,
        nationalId: String(1010000000+empN*137),
        jobTitle:title, departmentId:d.id, managerId:'',
        hireDate:`2024-0${(empN%9)+1}-01`,
        employmentType: empN%7===0?'متعاقد':'دائم', status:'نشط',
        basicSalary:basic, housingAllowance:housing, transportAllowance:800, otherAllowances:0,
        bankIBAN:'SA'+String(1000000000000000000+empN*99999999).slice(0,22),
        email:`emp${empN}@tu.edu.sa`, phone:'05'+String(30000000+empN*777),
        projectId:'', notes:''
      });
    });
  });
  const bigProjects = [...projects].sort((a,b)=>Number(b.allocatedBudget||0)-Number(a.allocatedBudget||0)).slice(0,6);
  employees.filter(e=>e.jobTitle.includes('منسق مشاريع')||e.jobTitle.includes('مطور نظم')).forEach((e,i)=>{
    if(bigProjects[i%bigProjects.length]) e.projectId = bigProjects[i%bigProjects.length].id;
  });

  const leaves = [];
  employees.slice(0,6).forEach((e,i)=>{
    leaves.push({
      id:uid('LV'), code:'LV-'+String(i+1).padStart(3,'0'), employeeId:e.id,
      type: LEAVE_TYPES[i%LEAVE_TYPES.length], startDate: today(), endDate: today(),
      days: 1+(i%5), status: i%4===0?'معلقة':(i%4===1?'مرفوضة':'معتمدة'),
      reason:'إجازة اعتيادية', approvedBy: i%4===2?'مدير القسم':''
    });
  });

  const monthKey = today().slice(0,7);
  const attendance = employees.map((e,i)=>({
    id:uid('ATT'), employeeId:e.id, month:monthKey,
    workDays:22, presentDays:22-(i%3), absentDays:(i%3===2?1:0), lateDays:i%4, leaveDays:i%3
  }));

  function prevMonthKey(mk){
    const [y,m] = mk.split('-').map(Number);
    const d = new Date(y, m-2, 1);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  }
  function computeRunLines(){
    return employees.filter(e=>e.status!=='منتهي الخدمة').map(e=>{
      const gross = Number(e.basicSalary||0)+Number(e.housingAllowance||0)+Number(e.transportAllowance||0)+Number(e.otherAllowances||0);
      const gosi = Math.round((Number(e.basicSalary||0)+Number(e.housingAllowance||0))*GOSI_RATE);
      return {id:uid('PL'), employeeId:e.id, basicSalary:e.basicSalary, housingAllowance:e.housingAllowance, transportAllowance:e.transportAllowance, otherAllowances:e.otherAllowances, grossSalary:gross, gosiDeduction:gosi, otherDeductions:0, netSalary:gross-gosi};
    });
  }
  const prevMonth = prevMonthKey(monthKey);
  const paidLines = computeRunLines();
  const paidRun = {
    id:uid('PAYRUN'), code:`PAYRUN-${prevMonth}`, month:prevMonth, status:'مصروف', lines:paidLines,
    totalGross: paidLines.reduce((a,l)=>a+l.grossSalary,0),
    totalDeductions: paidLines.reduce((a,l)=>a+l.gosiDeduction+l.otherDeductions,0),
    totalNet: paidLines.reduce((a,l)=>a+l.netSalary,0),
    createdAt: today(), approvedAt: today(), paidAt: today()
  };
  const draftLines = computeRunLines();
  const draftRun = {
    id:uid('PAYRUN'), code:`PAYRUN-${monthKey}`, month:monthKey, status:'مسودة', lines:draftLines,
    totalGross: draftLines.reduce((a,l)=>a+l.grossSalary,0),
    totalDeductions: draftLines.reduce((a,l)=>a+l.gosiDeduction+l.otherDeductions,0),
    totalNet: draftLines.reduce((a,l)=>a+l.netSalary,0),
    createdAt: today(), approvedAt:'', paidAt:''
  };

  return { departments, employees, leaves, attendance, payrollRuns:[paidRun, draftRun] };
}
function buildPayrollJournalEntry(run, accounts){
  const bank = accounts.find(a=>a.code==='1010');
  const salaries = accounts.find(a=>a.code==='5010');
  const payable = accounts.find(a=>a.code==='2030');
  const year = (run.month||today()).slice(0,4);
  return {
    id:uid('JE'), code:`JE-${year}-${run.code}`, date: run.paidAt||today(),
    description:`صرف مسير رواتب ${run.month}`, reference:`مسير رواتب ${run.code}`, status:'مرحّل', createdAt: today(),
    lines:[
      {id:uid('JL'), accountId:salaries.id, debit: run.totalGross, credit:0, description:'إجمالي الرواتب والبدلات'},
      {id:uid('JL'), accountId:payable.id, debit:0, credit: run.totalDeductions, description:'استقطاعات تأمينات اجتماعية مستحقة'},
      {id:uid('JL'), accountId:bank.id, debit:0, credit: run.totalNet, description:'صافي الرواتب المصروفة من البنك'},
    ]
  };
}

/* ---- Payroll ---- */
function generatePayrollRun(month){
  const activeEmployees = state.hr.employees.filter(e=>e.status!=='منتهي الخدمة');
  const lines = activeEmployees.map(e=>{
    const gross = Number(e.basicSalary||0)+Number(e.housingAllowance||0)+Number(e.transportAllowance||0)+Number(e.otherAllowances||0);
    const gosi = Math.round((Number(e.basicSalary||0)+Number(e.housingAllowance||0))*GOSI_RATE);
    return {id:uid('PL'), employeeId:e.id, basicSalary:e.basicSalary, housingAllowance:e.housingAllowance, transportAllowance:e.transportAllowance, otherAllowances:e.otherAllowances, grossSalary:gross, gosiDeduction:gosi, otherDeductions:0, netSalary:gross-gosi};
  });
  return {
    id:uid('PAYRUN'), code:`PAYRUN-${month}`, month, status:'مسودة', lines,
    totalGross: lines.reduce((a,l)=>a+l.grossSalary,0),
    totalDeductions: lines.reduce((a,l)=>a+l.gosiDeduction+l.otherDeductions,0),
    totalNet: lines.reduce((a,l)=>a+l.netSalary,0),
    createdAt: today(), approvedAt:'', paidAt:''
  };
}

  showModal('توليد مسير رواتب جديد', `
  <form onsubmit="submitGeneratePayroll(event)">
    <div class="form-grid"><div class="field full"><label>الشهر (YYYY-MM) *</label><input name="month" required value="${today().slice(0,7)}"></div></div>
    <p class="small muted">سيتم توليد المسير تلقائياً لجميع الموظفين النشطين، بناءً على الراتب الأساسي والبدلات المسجلة لكل موظف، مع خصم التأمينات الاجتماعية (٩.٧٥٪ من الأساسي + السكن).</p>
    <div class="form-actions"><button type="submit" class="btn">توليد المسير</button><button type="button" class="btn ghost" onclick="closeModal()">إلغاء</button></div>
  </form>`);
}
function submitGeneratePayroll(e){
  e.preventDefault();
  const f = new FormData(e.target);
  const month = f.get('month');
  if(state.hr.payrollRuns.some(r=>r.month===month)){ alert('يوجد مسير رواتب لهذا الشهر مسبقاً.'); return; }
  const run = generatePayrollRun(month);
  state.hr.payrollRuns.push(run);
  save(); closeModal(); toast('تم توليد مسير الرواتب كمسودة'); go('payrollRunDetail', run.id);

  const r = payrunById(id); if(!r) return;
  if(r.status==='مصروف'){ toast('تم صرف هذا المسير مسبقاً'); return; }
  if(r.status!=='معتمد'){ if(!confirm('المسير لم يُعتمد بعد، هل تريد اعتماده وصرفه مباشرة؟')) return; r.approvedAt = today(); }
  r.status = 'مصروف'; r.paidAt = today();
  const je = buildPayrollJournalEntry(r, state.accounting.accounts);
  state.accounting.journalEntries.push(je);
  save(); toast('تم صرف مسير الرواتب وترحيل القيد المحاسبي تلقائياً'); render();

function downloadPayrollRegisterCSV(id){
  const r = payrunById(id); if(!r) return;
  const rows = [['الموظف','القسم','الأساسي','بدل السكن','بدل النقل','بدلات أخرى','الإجمالي','الاستقطاعات','الصافي']];
  r.lines.forEach(l=>{
    const e=empById(l.employeeId); const d=e?deptById(e.departmentId):null;
    rows.push([e?.name||'', d?.name||'', l.basicSalary, l.housingAllowance, l.transportAllowance, l.otherAllowances, l.grossSalary, l.gosiDeduction+l.otherDeductions, l.netSalary]);
  });
  const csv = '\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});

  a.click(); URL.revokeObjectURL(url);
  toast('تم تجهيز سجل الرواتب بصيغة CSV');
}

function initiativeRollups(){
  const rollups = state.initiatives.map(init=>{
    const st = initiativeStats(init);
    return {
      name: init.title, id: init.id, projects: st.projects,
      transformationGoal: goalById(init.goalId)?.fullTitle||'', universityGoal: axisById(init.axisId)?.title||'',
      owner: init.owner, avgCompletion: st.progress,
      statuses: [...new Set(st.projects.map(p=>overallStatus(p).label))],
      start: st.start, end: st.end
    };
  });
  const orphans = state.projects.filter(p=>!p.initiativeId);
  if(orphans.length){
    const comp = computeProgress(orphans);
    rollups.push({name:'مشاريع بدون مبادرة مرتبطة', id:'', projects:orphans, transformationGoal:'', universityGoal:'', owner:'', avgCompletion:comp,
      statuses:[...new Set(orphans.map(p=>overallStatus(p).label))],
      start:orphans.map(p=>p.startDate).filter(Boolean).sort()[0], end:orphans.map(p=>p.endDate).filter(Boolean).sort().slice(-1)[0]});
  }
  return rollups.sort((a,b)=>b.projects.length-a.projects.length);
}

/* ================= DECISIONS CENTER ================= */
function decisionSupportItems(){
  const items = [];
  const nowD = new Date();
  state.projects.forEach(p=>{
    const comp = Number(p.currentCompletion||0);
    if(comp < 20 && p.phase===PHASES[2]){
      items.push({title:'متابعة انخفاض نسبة الإنجاز', project:p, evidence:`نسبة الإنجاز الحالية ${comp}% خلال مرحلة التنفيذ والمتابعة`, priority:'عالي', action:'مراجعة خطة العمل ووضع خطة تسريع للإنجاز'});
    }
    if(p.ragOverall==='متأخر'){
      items.push({title:'معالجة تعثر المشروع', project:p, evidence:`الحالة العامة: متأخر · حالة الجدول الزمني: ${p.ragSchedule}`, priority:'عالي', action:'مراجعة الجدول الزمني واعتماد إجراءات التصحيح'});
    }
    if(p.endDate && new Date(p.endDate) < nowD && comp < 100){
      items.push({title:'مراجعة تجاوز الموعد النهائي', project:p, evidence:`تجاوز الموعد النهائي المخطط (${fmtDate(p.endDate)}) والإنجاز الحالي ${comp}%`, priority:'عالي', action:'اعتماد موعد نهائي منقّح أو تسريع تنفيذ الأعمال المتبقية'});
    }
    const budget = Number(p.allocatedBudget||0), spend = Number(p.actualSpend||0);
    if(budget>0 && spend>budget){
      items.push({title:'مراجعة تجاوز الميزانية المعتمدة', project:p, evidence:`الصرف الفعلي ${fmtMoney(spend)} يتجاوز الميزانية المعتمدة ${fmtMoney(budget)}`, priority:'عالي', action:'اعتماد ميزانية إضافية أو ضبط نطاق العمل'});
    } else if(budget>0 && comp>0 && spend > budget*(comp/100)*1.15){
      items.push({title:'متابعة معدل الصرف مقابل الإنجاز', project:p, evidence:`معدل الصرف الحالي يفوق نسبة الإنجاز الفعلي (${comp}%)`, priority:'متوسط', action:'مراجعة كفاءة الصرف مقابل التقدم الفعلي للمشروع'});
    }
    if(!p.manager){
      items.push({title:'تحديد مدير للمشروع', project:p, evidence:'لا يوجد مدير مشروع محدد حالياً في بيانات النظام', priority:'متوسط', action:'تعيين مدير مشروع واعتماد المسؤولية التنفيذية'});
    }
    if(p.ragResources==='متأخر' || p.ragResources==='يحتاج متابعة'){
      items.push({title:'متابعة كفاية الموارد', project:p, evidence:`حالة الموارد الحالية: ${p.ragResources}`, priority: p.ragResources==='متأخر'?'عالي':'متوسط', action:'مراجعة تخصيص الموارد البشرية والتقنية للمشروع'});
    }
  });
  return items;
}

/* ================= DECISION ANALYTICS (فتح التحليلات) ================= */
function riskScoreFor(p){
  let score = 0; const reasons = [];
  const comp = Number(p.currentCompletion||0);
  if(p.ragOverall==='متأخر'){ score+=3; reasons.push('الحالة العامة متأخرة'); }
  else if(p.ragOverall==='يحتاج متابعة'){ score+=1; reasons.push('الحالة العامة تحتاج متابعة'); }
  if(comp<20 && p.phase===PHASES[2]){ score+=2; reasons.push('إنجاز منخفض في مرحلة التنفيذ'); }
  if(p.endDate && new Date(p.endDate)<new Date() && comp<100){ score+=2; reasons.push('تجاوز الموعد النهائي المخطط'); }
  const budget=Number(p.allocatedBudget||0), spend=Number(p.actualSpend||0);
  if(budget>0 && spend>budget){ score+=2; reasons.push('تجاوز الميزانية المعتمدة'); }
  else if(budget>0 && comp>0 && spend>budget*(comp/100)*1.15){ score+=1; reasons.push('معدل صرف أعلى من نسبة الإنجاز'); }
  if(!p.manager){ score+=1; reasons.push('لا يوجد مدير مشروع محدد'); }
  if(p.ragResources==='متأخر'){ score+=2; reasons.push('نقص حاد في الموارد'); }
  else if(p.ragResources==='يحتاج متابعة'){ score+=1; reasons.push('كفاية الموارد تحتاج متابعة'); }
  const level = score>=5 ? 'عالي' : score>=2 ? 'متوسط' : 'منخفض';
  if(!reasons.length) reasons.push('لا توجد مؤشرات مخاطرة حالياً');
  return {score, level, reasons};
}
function riskRecommendationText(level, reasons){
  if(level==='عالي') return 'مراجعة تنفيذية عاجلة موصى بها — أبرز الأسباب: ' + reasons.slice(0,2).join('، ');
  if(level==='متوسط') return 'متابعة دورية موصى بها لمعالجة: ' + (reasons[0]||'نقاط الانتباه الحالية');
  return 'المشروع مستقر ضمن المؤشرات الحالية — الاستمرار بالمتابعة الروتينية';
}

function reportManager(p){ return p?.manager || 'فريق عمادة التعليم الإلكتروني وتقنية المعلومات'; }
function reportVendor(p){ return p?.vendor || 'تنفيذ داخلي — عمادة التعليم الإلكتروني وتقنية المعلومات'; }
function reportPortfolio(p){ return p?.portfolio || 'الابتكار الرقمي'; }
function reportProgram(p){ return p?.program || p?.initiative || 'البنية التحتية والحلول الرقمية'; }
function reportChangeRequests(p){ return p?.changeRequestsNote || 'لا يوجد طلبات تغيير'; }
function reportContractAmount(p){ return Number(p?.allocatedBudget||0); }
function reportContractAmountRevised(p){ return Number(p?.contractAmountRevised || p?.allocatedBudget || 0); }

function fallbackMilestones(p){
  if((p?.milestones||[]).length) return p.milestones;
  const start = new Date(p?.startDate || '2026-01-01');
  const end = new Date(p?.endDate || '2028-12-31');
  const totalMs = Math.max(30*86400000, end-start);
  const phases = ['توقيع العقد وتحديد النطاق','التخطيط والتصميم التفصيلي','التنفيذ والتطوير','الاختبار والتشغيل التجريبي','التسليم والتشغيل الفعلي','قياس جودة الخدمات المقدمة','التقرير الختامي وإغلاق المشروع'];
  const n = phases.length;
  const comp = Number(p?.currentCompletion||0);
  return phases.map((name,i)=>{
    const segStart = new Date(start.getTime() + totalMs*(i/n));
    const segEnd = new Date(start.getTime() + totalMs*((i+1)/n));
    const posPct = ((i+1)/n)*100, prevPct = (i/n)*100;
    const mComp = comp>=posPct ? 100 : (comp<=prevPct ? 0 : Math.round(((comp-prevPct)/(100/n))*100));
    return {id:uid('MS'), name, start:segStart.toISOString().slice(0,10), end:segEnd.toISOString().slice(0,10), completion:mComp};
  });
}
function statusColorFor(m){
  const due = new Date(m.end); const now = new Date();
  if((m.completion||0)>=100) return 'green';
  if(due < now){ const overdueDays = (now-due)/86400000; return overdueDays>30 ? 'red' : 'amber'; }
  return 'green';
}
function fallbackDeliverables(p, milestones){
  return milestones.map(m=>{
    const done = (m.completion||0)>=100;
    const started = (m.completion||0)>0;
    return {
      title: 'مخرج: ' + m.name,
      due: m.end,
      received: done ? 'تم التسليم' : (started ? 'قيد التنفيذ' : 'لم يبدأ بعد'),
      evalText: done ? 'معتمد' : (started ? 'قيد المراجعة الفنية' : 'لم يُستحق التقييم بعد'),
      notes: done ? 'تم الاستلام دون ملاحظات' : (started ? 'العمل جارٍ ضمن الجدول الزمني المعتمد' : 'مجدول ضمن المراحل القادمة'),
      color: statusColorFor(m)
    };
  });
}
function quartersRange(startDate, endDate){
  const s = new Date(startDate||'2026-01-01'), e = new Date(endDate||'2028-12-31');
  const startY = s.getFullYear(), endY = Math.max(e.getFullYear(), s.getFullYear());
  const qs = [];
  for(let y=startY; y<=endY; y++) for(let q=1; q<=4; q++) qs.push({year:y, q});
  return qs;
}
function quarterOf(dateStr){ const d = new Date(dateStr); return {year:d.getFullYear(), q: Math.floor(d.getMonth()/3)+1}; }
function quarterIdx(qs, year, q){ return qs.findIndex(x=>x.year===year && x.q===q); }

function donutStyle(pct, colorVar){
  pct = Math.max(0, Math.min(100, pct));
  return `background:conic-gradient(var(${colorVar}) 0% ${pct}%, #e3ded0 ${pct}% 100%)`;
}

  </div>`;

  /* ---------- PAGE 2: Timeline (quarterly Gantt) ---------- */
  const qs = quartersRange(
    milestones.reduce((min,m)=>m.start<min?m.start:min, p.startDate||milestones[0].start),
    milestones.reduce((max,m)=>m.end>max?m.end:max, p.endDate||milestones[0].end)
  );
  const byYear = {};
  qs.forEach(x=>{ byYear[x.year] = (byYear[x.year]||0)+1; });
  const years = Object.keys(byYear);
  const nowQ = quarterOf(today());
  const nowIdx = quarterIdx(qs, nowQ.year, nowQ.q);
  const tlRows = milestones.map((m,i)=>{

  /* ---------- PAGE 3: Deliverables ---------- */
  const dlRows = deliverables.map((d,i)=>`<tr>

  return page1 + page2 + page3;
}

/* ---- Word-editable version of the report: pure tables + bgcolor (Word's HTML
   renderer has no CSS grid, flexbox, or conic-gradient support) ---- */
function wbar(pct, colorHex){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  const total = 200;
  const filled = Math.round(total * pct / 100);
  const rest = total - filled;
  return `<table border="0" cellspacing="0" cellpadding="0" style="width:${total}px"><tr>
    ${filled>0?`<td width="${filled}" bgcolor="${colorHex}" style="height:16px;font-size:1px;line-height:1px">&nbsp;</td>`:''}
    ${rest>0?`<td width="${rest}" bgcolor="#E3DED0" style="height:16px;font-size:1px;line-height:1px">&nbsp;</td>`:''}
  </tr></table>`;
}
function wReportHead(p){
  return `<table class="doc-head"><tr>
    <td style="width:66%"><div class="doc-title" style="text-align:right;font-size:19px">${esc(p.nameAr)}</div></td>
    <td style="width:34%;text-align:left"><img src="data:image/png;base64,${LOGO_B64}" style="height:44px"></td>
  </tr></table>`;
}
