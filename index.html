<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نظام إدارة المشاريع | جامعة الطائف</title>
<meta name="description" content="نظام إدارة المشاريع - جامعة الطائف">
<link rel="icon" href="data:image/png;base64,iVBORw0KGgo=">
<style>
:root{
  --primary:#D5B254; --primary-dark:#a9862f; --primary-light:#faf4e2;
  --secondary:#537E54; --green:#2f7d45; --red:#c83b3b; --amber:#c98a1f; --gray:#8b8f91; --blue:#2f68b2;
  --ink:#24302a; --muted:#6f7871; --bg:#f5f4ef; --line:#e6e1d5; --white:#fff;
  --shadow:0 10px 28px rgba(48,55,43,.08); --radius:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:13.5px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9d3c2;border-radius:10px}

/* ===== top bar ===== */
.top{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:44px;width:auto;object-fit:contain}
.brand .system{border-right:1px solid var(--line);padding-right:14px}
.brand .system b{display:block;font-size:15px;letter-spacing:.2px}
.brand .system span{font-size:10.5px;color:var(--muted)}
.top-actions{display:flex;gap:10px;align-items:center}
.icon-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:14px;position:relative}
.icon-btn:hover{background:#faf8f3}
.badge-dot{position:absolute;top:-4px;left:-4px;background:var(--red);color:#fff;font-size:9px;border-radius:99px;padding:1px 5px;min-width:16px;text-align:center}
.user-chip{background:var(--primary-light);border:1px solid #ecdcab;border-radius:999px;padding:8px 14px;font-weight:700;color:#6b5420;font-size:12.5px}

/* ===== layout ===== */
.layout{display:grid;grid-template-columns:264px 1fr;min-height:calc(100vh - 74px)}
aside{background:#fff;border-left:1px solid var(--line);padding:16px 12px;position:sticky;top:74px;height:calc(100vh - 74px);overflow:auto}
.section-label{font-size:10.5px;color:#9a9d98;padding:14px 10px 6px;text-transform:uppercase;letter-spacing:.5px}
.nav-btn{width:100%;border:0;background:none;text-align:right;color:#566159;padding:10px 12px;border-radius:9px;margin:2px 0;display:flex;gap:10px;align-items:center;font-size:13px}
.nav-btn:hover{background:#f7f4ed}
.nav-btn.active{background:var(--primary-light);color:#6b5420;border-right:3px solid var(--primary);font-weight:700}
.nav-btn .ico{width:18px;text-align:center;font-size:15px}
.aside-foot{margin-top:18px;background:#f9f7f2;border:1px solid var(--line);border-radius:12px;padding:12px}
.aside-foot b{font-size:11.5px}
.aside-foot small{display:block;color:var(--muted);margin-top:5px;line-height:1.6}

main{padding:26px 28px 60px;max-width:1500px;width:100%;margin:auto}

/* ===== headers / cards ===== */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{color:var(--secondary);font-weight:800;font-size:11px;letter-spacing:.4px;text-transform:uppercase}
.head h1{margin:4px 0 6px;font-size:24px}
.head p{margin:0;color:var(--muted);max-width:640px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid transparent;background:var(--primary);color:#fff;border-radius:9px;padding:10px 16px;font-weight:700;font-size:12.5px;transition:.15s}
.btn:hover{background:var(--primary-dark)}
.btn.secondary{background:#fff;color:#655420;border-color:#dcc487}
.btn.secondary:hover{background:var(--primary-light)}
.btn.ghost{background:#fff;color:#4f5b54;border-color:var(--line)}
.btn.ghost:hover{background:#f7f4ed}
.btn.danger{background:var(--red)}
.btn.danger:hover{background:#a92f2f}
.btn.sm{padding:6px 10px;font-size:11.5px;border-radius:7px}
.btn:focus,.nav-btn:focus,input:focus,select:focus,textarea:focus{outline:3px solid rgba(202,159,69,.25);outline-offset:1px}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:15px;margin-top:15px}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.three{grid-template-columns:1fr}}
@media(max-width:720px){.layout{grid-template-columns:1fr}aside{display:none}.grid{grid-template-columns:1fr}}

.kpi-card small{color:var(--muted);font-size:11px}
.kpi-card b{display:block;font-size:26px;margin:5px 0 2px}
.kpi-card em{font-style:normal;color:var(--muted);font-size:11px}
.stat-box{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
.stat-box small{color:var(--muted);font-size:10.5px;display:block}
.stat-box b{font-size:19px}

.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px;flex-wrap:wrap}
.title h2{margin:0;font-size:15.5px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.badge-count{background:var(--primary-light);color:#6b5420;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:700}

.status{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700}
.status .dot{width:7px;height:7px;border-radius:50%}
.status.green{background:#e9f4ec;color:#1f6a35}.status.green .dot{background:var(--green)}
.status.red{background:#fbeaea;color:#a92f2f}.status.red .dot{background:var(--red)}
.status.gray{background:#f1f1ee;color:#5c605d}.status.gray .dot{background:var(--gray)}
.status.blue{background:#eaf1fa;color:#204d85}.status.blue .dot{background:var(--blue)}
.status.gold{background:var(--primary-light);color:#83651e}.status.gold .dot{background:var(--primary)}
.status.amber{background:#fbf1e2;color:#8a5c0f}.status.amber .dot{background:var(--amber)}

.progress-row{display:flex;align-items:center;gap:8px}
.bar{flex:1;height:8px;background:#eee9dc;border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#e0be74);border-radius:99px}

.notice{background:#faf6ea;border:1px dashed #e0cf9c;border-radius:11px;padding:12px 14px;margin-bottom:16px;font-size:12.3px}
.notice strong{display:block;color:#755c1f;margin-bottom:3px;font-size:12.5px}
.empty{padding:26px 10px;text-align:center;color:var(--muted);font-size:12.5px}
.empty strong{display:block;color:#4c554e;margin-bottom:4px}

.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:11px;color:var(--muted);font-weight:700}
.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-width:150px}
.field textarea{min-height:70px;resize:vertical;font-family:inherit}
.field.full{grid-column:1/-1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid.three-col{grid-template-columns:1fr 1fr 1fr}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
@media(max-width:640px){.form-grid,.form-grid.three-col{grid-template-columns:1fr}}

.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;min-width:640px}
.table th{text-align:right;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:10px 12px;border-bottom:2px solid var(--line)}
.table td{padding:11px 12px;border-bottom:1px solid #f0ede3;font-size:12.6px;vertical-align:middle}
.table tr:hover td{background:#fbfaf6}
.link{background:none;border:0;color:var(--secondary);font-weight:700;text-decoration:underline;padding:0;font-size:inherit;cursor:pointer}
.link:hover{color:var(--primary-dark)}
.muted{color:var(--muted)}
.small{font-size:11.5px}

.detail-banner{background:linear-gradient(135deg,#2b3a30,#3d4f41);color:#fff;border-radius:14px;padding:22px 24px;margin-bottom:16px}
.detail-banner small{opacity:.75;font-size:11px}
.detail-banner h1{margin:6px 0 8px;font-size:22px}
.detail-banner .meta{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}
.detail-banner .meta div{background:rgba(255,255,255,.08);border-radius:9px;padding:9px 11px}
.detail-banner .meta small{display:block;opacity:.7}
.detail-banner .meta b{font-size:14px}
@media(max-width:800px){.detail-banner .meta{grid-template-columns:1fr 1fr}}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.tab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:99px;font-size:12px;font-weight:700;color:#5c655e}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

.row{padding:9px 0;border-bottom:1px solid #f0ede3}
.row:last-child{border-bottom:0}

/* gantt */
.gantt-row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid #f2efe6}
.gantt-row .gt-label{font-size:12px}
.gantt-row .gt-label small{display:block;color:var(--muted);font-size:10.5px}
.gt-track{position:relative;height:20px;background:#f4f2ea;border-radius:6px}
.gt-bar{position:absolute;top:2px;bottom:2px;background:linear-gradient(90deg,var(--secondary),#8fb08c);border-radius:5px}
.gt-bar.late{background:linear-gradient(90deg,var(--red),#e08181)}
.gt-fill{position:absolute;inset:0;background:rgba(0,0,0,.18);border-radius:5px 0 0 5px}
.gt-header{display:grid;grid-template-columns:220px 1fr;gap:10px;margin-bottom:6px;font-size:10.5px;color:var(--muted)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(24,28,22,.5);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.modal-head h2{margin:0;font-size:16.5px}
.close{border:0;background:#f1efe6;border-radius:8px;width:30px;height:30px;font-size:14px}

/* templates */
.tpl-card{display:flex;flex-direction:column;gap:10px}
.tpl-card .tpl-ico{width:44px;height:44px;border-radius:11px;background:var(--primary-light);display:flex;align-items:center;justify-content:center;font-size:20px}
.tpl-card h3{margin:0;font-size:14.5px}
.tpl-card p{margin:0;color:var(--muted);font-size:12px;flex:1}

/* toast */
.toast{position:fixed;bottom:22px;left:22px;background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;z-index:200;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:12px}

/* print report */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%;padding:20px}
  .rp-page{page-break-after:always}
}
.rp-head{display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--primary);padding-bottom:14px;margin-bottom:16px}
.rp-head img{height:46px}
.rp-head .rp-title{text-align:left}
.rp-title h1{margin:0;font-size:18px}
.rp-title small{color:var(--muted)}
.rp-section{margin-bottom:16px}
.rp-section h3{font-size:12.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--secondary);border-bottom:1px solid var(--line);padding-bottom:5px;margin:0 0 8px}
.rp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.rp-grid div{background:#faf8f3;border-radius:8px;padding:8px 10px}
.rp-grid small{display:block;color:var(--muted);font-size:10px}
.rp-table{width:100%;border-collapse:collapse;font-size:11.5px}
.rp-table th,.rp-table td{border:1px solid var(--line);padding:6px 8px;text-align:right}
.rp-table th{background:#faf8f3}
.rp-foot{margin-top:24px;padding-top:12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between}

/* ---- Executive report v2 (dashboard-style, matches reference report) ---- */
.rp2-title-bar{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid var(--primary);padding:0 2px 12px;margin-bottom:14px}
.rp2-title-bar img{height:38px}
.rp2-title-bar h1{font-size:18px;margin:0;color:#3c3417}
.rp2-info-row{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.rp2-info-card{flex:1;min-width:95px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rp2-info-card .h{background:var(--primary);color:#fff;font-size:10px;font-weight:700;text-align:center;padding:6px 4px}
.rp2-info-card .v{background:#fff;font-size:10.5px;text-align:center;padding:7px 4px;font-weight:700;min-height:30px;display:flex;align-items:center;justify-content:center;line-height:1.4}
.rp2-desc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11px;background:#fff}
.rp2-desc .h{font-weight:800;color:var(--secondary);margin-bottom:4px;font-size:10.5px}
.rp2-cols{display:grid;grid-template-columns:1fr 1.35fr;gap:12px;margin-bottom:10px}
.rp2-charts{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff}
.rp2-chart-row{display:flex;gap:10px;align-items:flex-start;justify-content:space-around;margin-bottom:8px}
.rp2-chart-col{display:flex;flex-direction:column;align-items:center}
.rp2-donut{width:96px;height:96px;border-radius:50%}
.rp2-donut-label{text-align:center;font-size:9.5px;margin-top:6px;font-weight:700}
.rp2-bars{display:flex;gap:12px;align-items:flex-end;height:96px}
.rp2-bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:34px}
.rp2-bar{width:24px;border-radius:4px 4px 0 0;position:relative}
.rp2-bar-val{font-size:9px;font-weight:800;margin-bottom:2px}
.rp2-legend{display:flex;gap:12px;justify-content:center;font-size:9px;margin-top:6px;flex-wrap:wrap}
.rp2-legend span{display:inline-flex;align-items:center;gap:4px}
.rp2-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.rp2-contract{display:flex;gap:8px;margin-top:8px}
.rp2-contract div{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px;text-align:center;background:#fff}
.rp2-contract small{display:block;color:var(--muted);font-size:9px}
.rp2-contract b{font-size:11.5px}
.rp2-targets{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.rp2-targets table{width:100%;border-collapse:collapse}
.rp2-targets th{background:var(--primary);color:#fff;font-size:10px;padding:7px 8px;text-align:right}
.rp2-targets td{border-top:1px solid var(--line);padding:7px 8px;font-size:10.5px}
.rp2-foot-legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:9.5px;padding-top:8px;border-top:1px solid var(--line)}
.rp2-tl-wrap{overflow-x:auto}
.rp2-tl-table{width:100%;border-collapse:collapse;font-size:8.6px}
.rp2-tl-table th{background:var(--primary);color:#fff;padding:3px 1px;text-align:center;font-weight:700}
.rp2-tl-table th.yr{font-size:9.5px;padding:4px 1px}
.rp2-tl-table td{border:1px solid #ece7d9;padding:0;text-align:center;height:19px;min-width:14px}
.rp2-tl-table td.lbl{border:1px solid var(--line);text-align:right;padding:4px 7px;font-size:9px;min-width:150px;background:#fff;font-weight:600}
.rp2-tl-table td.pct{font-weight:800;background:#fff;font-size:9px}
.rp2-tl-table td.num{background:#faf8f3;font-weight:700;font-size:9px}
.rp2-tl-fill{background:linear-gradient(90deg,var(--secondary),#8fb08c);height:100%}
.rp2-tl-caption{font-size:9.5px;color:var(--muted);margin-top:8px;text-align:center}
.rp2-dl-table{width:100%;border-collapse:collapse;font-size:10px}
.rp2-dl-table th{background:var(--primary);color:#fff;padding:8px 7px;text-align:right}
.rp2-dl-table td{border:1px solid var(--line);padding:8px 7px;vertical-align:middle}

[hidden]{display:none!important}
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <img id="logoImg" alt="شعار جامعة الطائف">
    <div class="system">
      <b id="sysNameAr">نظام إدارة المشاريع</b>
      <span id="sysNameEn">Taif University &middot; Project Management System</span>
    </div>
  </div>
  <div class="top-actions">
    <button class="icon-btn" title="الإشعارات" onclick="go('notifications')">🔔<span class="badge-dot" id="notifBadge" hidden>0</span></button>
    <button class="icon-btn" title="نسخة احتياطية" onclick="exportBackup()">⭳</button>
    <span class="user-chip" id="userChip">مستخدم النظام</span>
  </div>
</div>

<div class="layout">
  <aside>
    <div class="section-label">الرئيسية</div>
    <button class="nav-btn" data-p="dashboard" onclick="go('dashboard')"><span class="ico">📊</span> لوحة التحكم</button>
    <div class="section-label">إدارة المشاريع</div>
    <button class="nav-btn" data-p="projects" onclick="go('projects')"><span class="ico">🗂️</span> محفظة المشاريع</button>
    <button class="nav-btn" data-p="schedule" onclick="go('schedule')"><span class="ico">📅</span> الجدول الزمني</button>
    <button class="nav-btn" data-p="risks" onclick="go('risks')"><span class="ico">⚠️</span> المخاطر والمشكلات</button>
    <div class="section-label">التقارير</div>
    <button class="nav-btn" data-p="reports" onclick="go('reports')"><span class="ico">📄</span> تقارير المشاريع</button>
    <button class="nav-btn" data-p="templates" onclick="go('templates')"><span class="ico">🧾</span> نماذج فارغة</button>
    <div class="section-label">الحوكمة القيادية</div>
    <button class="nav-btn" data-p="leadership" onclick="go('leadership')"><span class="ico">🧭</span> متابعة القيادات والمبادرات</button>
    <button class="nav-btn" data-p="decisionsCenter" onclick="go('decisionsCenter')"><span class="ico">⚖️</span> مركز القرارات</button>
    <div class="section-label">النظام</div>
    <button class="nav-btn" data-p="notifications" onclick="go('notifications')"><span class="ico">🔔</span> الإشعارات</button>
    <button class="nav-btn" data-p="settings" onclick="go('settings')"><span class="ico">⚙️</span> الإعدادات</button>
    <div class="aside-foot">
      <b>عمادة التعليم الإلكتروني وتقنية المعلومات</b>
    </div>
  </aside>
  <main id="app" tabindex="-1"></main>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-box" id="modalBox"></div>
</div>

<div id="printArea"></div>

<script>
/* =========================================================
   Taif University · Project Management System

function numberToArabicWords(n){
  n = Math.round(Number(n||0));
  if(n===0) return 'صفر ريال سعودي فقط لا غير';
  const ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['','عشرة','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds = ['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function three(num){
    let s='';
    const h=Math.floor(num/100), r=num%100;
    if(h) s += hundreds[h];
    if(r){
      if(s) s += ' و';
      if(r<20) s += ones[r];
      else { const t=Math.floor(r/10), o=r%10; s += (o?ones[o]+' و':'') + tens[t]; }
    }
    return s;
  }
  const groups = [ [1000000000,'مليار'], [1000000,'مليون'], [1000,'ألف'], [1,''] ];
  let parts = [];
  let rem = n;
  for(const [val,label] of groups){
    if(rem>=val){
      const count = Math.floor(rem/val);
      rem = rem % val;
      if(val===1){ if(count>0) parts.push(three(count)); }
      else parts.push(three(count) + ' ' + label + (count>=3&&count<=10?'':''));
    }
  }
  return parts.join(' و') + ' ريال سعودي فقط لا غير';
}

let state = loadState();
function loadState(){ try{ const raw = JSON.parse(localStorage.getItem(STORAGE_KEY)); if(raw && raw.projects) return raw; }catch(e){} return defaultState(); }
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let currentPage = location.hash.replace('#','') || 'dashboard';
let currentProjectId = null;

function go(p, id){
  currentPage = p; currentProjectId = id || null;
  location.hash = p;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
  document.getElementById('app')?.focus();
}

/* ---------------- helpers on projects ---------------- */
function projectById(id){ return state.projects.find(p=>p.id===id); }
function ragClass(r){ return r==='على المسار'?'green':r==='متأخر'?'red':'amber'; }
function overallStatus(p){
  if(p.phase===PHASES[3] && p.currentCompletion>=100) return {label:'مكتمل',cls:'blue'};
  if(!p.currentCompletion && p.phase===PHASES[0]) return {label:'لم يبدأ',cls:'gray'};
  return {label:p.ragOverall,cls:ragClass(p.ragOverall)};
}
function budgetVariance(p){ return (Number(p.allocatedBudget||0) - Number(p.actualSpend||0)); }
function scheduleVarianceDays(p){ const d=daysBetween(p.endDate,p.estimatedEndDate); return d===null?0:d; }

function head(eyebrow,title,desc,actions){
  return `<div class="head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div><div class="actions">${actions||''}</div></div>`;
}
function statusBadge(label,cls){ return `<span class="status ${cls}"><span class="dot"></span>${esc(label)}</span>`; }

/* ================= DASHBOARD ================= */
function pageDashboard(){
  const ps = state.projects;
  const total = ps.length;
  const onTrack = ps.filter(p=>overallStatus(p).cls==='green').length;
  const watch = ps.filter(p=>overallStatus(p).cls==='amber').length;
  const late = ps.filter(p=>overallStatus(p).cls==='red').length;
  const done = ps.filter(p=>overallStatus(p).cls==='blue').length;
  const totalBudget = ps.reduce((a,p)=>a+Number(p.allocatedBudget||0),0);
  const totalSpend = ps.reduce((a,p)=>a+Number(p.actualSpend||0),0);
  const avg = ps.length? Math.round(ps.reduce((a,p)=>a+Number(p.currentCompletion||0),0)/ps.length) : 0;

  return head('نظرة عامة','لوحة التحكم التنفيذية','متابعة محفظة المشاريع، الجدول الزمني، الميزانية، والمخاطر في مكان واحد.',

    <div class="card kpi-card"><small>يحتاج متابعة / متأخر</small><b>${watch+late}</b><em>${late} متأخر · ${watch} يحتاج متابعة</em></div>
    <div class="card kpi-card"><small>متوسط نسبة الإنجاز</small><b>${avg}%</b><em>عبر جميع المشاريع</em></div>
  </div>
  <div class="two">
    <section class="card">
      <div class="title"><h2>حالة المحفظة</h2><div class="legend">${statusBadge('على المسار','green')}${statusBadge('يحتاج متابعة','amber')}${statusBadge('متأخر','red')}${statusBadge('مكتمل','blue')}</div></div>
      <div class="three">

        <div class="stat-box"><small>إجمالي الصرف الفعلي</small><b style="font-size:14px">${fmtMoney(totalSpend)}</b></div>
      </div>
    </section>
    <section class="card">
      <div class="title"><h2>أعلى 5 مشاريع من حيث الصرف</h2></div>
      ${[...ps].sort((a,b)=>(b.actualSpend||0)-(a.actualSpend||0)).slice(0,5).map(p=>{
        const pct = p.allocatedBudget? Math.min(100,Math.round((p.actualSpend/p.allocatedBudget)*100)) : 0;
        return `<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;font-size:12px"><b>${esc(p.nameAr)}</b><span class="muted">${pct}%</span></div>

function projectRows(arr){
  return arr.map(p=>{const st=overallStatus(p);return `<tr>
    <td><button class="link" onclick="go('projectDetail','${p.id}')">${esc(p.nameAr)}</button><div class="muted small">${esc(p.code)}</div></td>
    <td>${esc(p.manager||'—')}</td>
    <td class="small">${esc(p.phase)}</td>
    <td class="small">${fmtDate(p.startDate)} → ${fmtDate(p.endDate)}</td>
    <td><div class="progress-row" style="min-width:130px"><div class="bar"><span style="width:${p.currentCompletion||0}%"></span></div><small>${p.currentCompletion||0}%</small></div></td>
    <td>${statusBadge(st.label,st.cls)}</td>
    <td><button class="link" onclick="go('projectDetail','${p.id}')">فتح</button></td>
  </tr>`}).join('') || `<tr><td colspan="7"><div class="empty">لا توجد مشاريع مطابقة.</div></td></tr>`;
}
function filterProjects(){
  const q=(document.getElementById('pq').value||'').trim();
  const f=document.getElementById('pf').value;
  const arr = state.projects.filter(p=>{
    const matchQ = !q || (p.nameAr+' '+p.code+' '+(p.nameEn||'')).includes(q);
    const st = overallStatus(p);
    const matchF = f==='الكل' || st.label===f;
    return matchQ && matchF;
  });
  document.getElementById('ptbody').innerHTML = projectRows(arr);
}

function submitProject(e, id){
  e.preventDefault();
  const f = new FormData(e.target);
  const data = Object.fromEntries(f.entries());
  ['allocatedBudget','actualSpend','plannedSpend','prevCompletion','currentCompletion','plannedCompletion'].forEach(k=>data[k]=Number(data[k]||0));
  if(id){
    const p = projectById(id);
    Object.assign(p, data); p.updatedAt = today();
    notify('تم تحديث المشروع', `تم تحديث بيانات "${p.nameAr}".`);
  } else {
    const p = Object.assign({id:uid('PRJ'), milestones:[], tasks:[], reportsLog:[], createdAt:today(), updatedAt:today()}, data);
    state.projects.unshift(p);
    notify('تمت إضافة مشروع جديد', `تمت إضافة "${p.nameAr}" إلى المحفظة.`);
  }
  save(); closeModal();
  toast('تم حفظ بيانات المشروع بنجاح');
  render();
}
function deleteProject(id){
  if(!confirm('هل أنت متأكد من حذف هذا المشروع؟ لا يمكن التراجع عن هذا الإجراء.')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  save(); toast('تم حذف المشروع'); go('projects');
}

function ganttHtml(p){
  const tasks = p.tasks||[];
  if(!tasks.length) return `<div class="empty">لا توجد مهام مضافة لهذا المشروع.</div>`;
  const starts = tasks.map(t=>new Date(t.start).getTime()).filter(Boolean);
  const ends = tasks.map(t=>new Date(t.due).getTime()).filter(Boolean);
  const minD = Math.min(...starts, new Date(p.startDate||today()).getTime());
  const maxD = Math.max(...ends, new Date(p.endDate||today()).getTime());
  const span = Math.max(1, maxD-minD);
  const todayPct = Math.min(100, Math.max(0, ((Date.now()-minD)/span)*100));
  return `<div class="gt-header"><div>المهمة</div><div>الجدول الزمني (${fmtDate(p.startDate)} → ${fmtDate(p.endDate)})</div></div>
  ${tasks.map(t=>{
    const s = new Date(t.start).getTime(), e = new Date(t.due).getTime();
    const left = Math.max(0, ((s-minD)/span)*100);
    const width = Math.max(1.5, ((e-s)/span)*100);
    const isLate = (t.pct<100 && e < Date.now());
    return `<div class="gantt-row">
      <div class="gt-label"><b>${esc(t.taskId)} — ${esc(t.title)}</b><small>${esc(t.owner||'')} · ${t.duration||daysBetween(t.start,t.due)||0} يوم</small></div>
      <div class="gt-track">
        <div class="gt-bar ${isLate?'late':''}" style="right:${left}%;width:${width}%">
          <div class="gt-fill" style="width:${100-(t.pct||0)}%"></div>
        </div>
      </div>
    </div>`;
  }).join('')}
  <div class="small muted" style="margin-top:8px">النسبة الملوّنة الداكنة داخل كل شريط تمثل الجزء المتبقي من المهمة. الأشرطة الحمراء تشير إلى مهام متأخرة عن موعدها.</div>`;
}

/* ================= LEADERSHIP & INITIATIVES MONITORING ================= */
function initiativeRollups(){
  const map = {};
  state.projects.forEach(p=>{
    const key = (p.initiative||'').trim() || 'مشاريع بدون مبادرة مرتبطة';
    if(!map[key]) map[key] = {name:key, projects:[], transformationGoal:p.transformationGoal, universityGoal:p.universityGoal, owner:p.owner};
    map[key].projects.push(p);
  });
  return Object.values(map).map(g=>{
    const comp = g.projects.length ? Math.round(g.projects.reduce((a,p)=>a+Number(p.currentCompletion||0),0)/g.projects.length) : 0;
    const statuses = [...new Set(g.projects.map(p=>overallStatus(p).label))];
    const starts = g.projects.map(p=>p.startDate).filter(Boolean).sort();
    const ends = g.projects.map(p=>p.endDate).filter(Boolean).sort();
    return {...g, avgCompletion:comp, statuses, start:starts[0], end:ends[ends.length-1]};
  }).sort((a,b)=>b.projects.length-a.projects.length);
}

function decisionSupportItems(){
  const items = [];
  const nowD = new Date();
  state.projects.forEach(p=>{
    const comp = Number(p.currentCompletion||0);
    if(comp < 20 && p.phase===PHASES[2]){
      items.push({title:'متابعة انخفاض نسبة الإنجاز', project:p, evidence:`نسبة الإنجاز الحالية ${comp}% خلال مرحلة التنفيذ والمتابعة`, priority:'عالي', action:'مراجعة خطة العمل ووضع خطة تسريع للإنجاز'});
    }
    if(p.ragOverall==='متأخر'){
      items.push({title:'معالجة تعثر المشروع', project:p, evidence:`الحالة العامة: متأخر · حالة الجدول الزمني: ${p.ragSchedule}`, priority:'عالي', action:'مراجعة الجدول الزمني واعتماد إجراءات التصحيح'});
    }
    if(p.endDate && new Date(p.endDate) < nowD && comp < 100){
      items.push({title:'مراجعة تجاوز الموعد النهائي', project:p, evidence:`تجاوز الموعد النهائي المخطط (${fmtDate(p.endDate)}) والإنجاز الحالي ${comp}%`, priority:'عالي', action:'اعتماد موعد نهائي منقّح أو تسريع تنفيذ الأعمال المتبقية'});
    }
    const budget = Number(p.allocatedBudget||0), spend = Number(p.actualSpend||0);
    if(budget>0 && spend>budget){
      items.push({title:'مراجعة تجاوز الميزانية المعتمدة', project:p, evidence:`الصرف الفعلي ${fmtMoney(spend)} يتجاوز الميزانية المعتمدة ${fmtMoney(budget)}`, priority:'عالي', action:'اعتماد ميزانية إضافية أو ضبط نطاق العمل'});
    } else if(budget>0 && comp>0 && spend > budget*(comp/100)*1.15){
      items.push({title:'متابعة معدل الصرف مقابل الإنجاز', project:p, evidence:`معدل الصرف الحالي يفوق نسبة الإنجاز الفعلي (${comp}%)`, priority:'متوسط', action:'مراجعة كفاءة الصرف مقابل التقدم الفعلي للمشروع'});
    }
    if(!p.manager){
      items.push({title:'تحديد مدير للمشروع', project:p, evidence:'لا يوجد مدير مشروع محدد حالياً في بيانات النظام', priority:'متوسط', action:'تعيين مدير مشروع واعتماد المسؤولية التنفيذية'});
    }
    if(p.ragResources==='متأخر' || p.ragResources==='يحتاج متابعة'){
      items.push({title:'متابعة كفاية الموارد', project:p, evidence:`حالة الموارد الحالية: ${p.ragResources}`, priority: p.ragResources==='متأخر'?'عالي':'متوسط', action:'مراجعة تخصيص الموارد البشرية والتقنية للمشروع'});
    }
  });
  return items;
}

/* ================= DECISION ANALYTICS (فتح التحليلات) ================= */
function riskScoreFor(p){
  let score = 0; const reasons = [];
  const comp = Number(p.currentCompletion||0);
  if(p.ragOverall==='متأخر'){ score+=3; reasons.push('الحالة العامة متأخرة'); }
  else if(p.ragOverall==='يحتاج متابعة'){ score+=1; reasons.push('الحالة العامة تحتاج متابعة'); }
  if(comp<20 && p.phase===PHASES[2]){ score+=2; reasons.push('إنجاز منخفض في مرحلة التنفيذ'); }
  if(p.endDate && new Date(p.endDate)<new Date() && comp<100){ score+=2; reasons.push('تجاوز الموعد النهائي المخطط'); }
  const budget=Number(p.allocatedBudget||0), spend=Number(p.actualSpend||0);
  if(budget>0 && spend>budget){ score+=2; reasons.push('تجاوز الميزانية المعتمدة'); }
  else if(budget>0 && comp>0 && spend>budget*(comp/100)*1.15){ score+=1; reasons.push('معدل صرف أعلى من نسبة الإنجاز'); }
  if(!p.manager){ score+=1; reasons.push('لا يوجد مدير مشروع محدد'); }
  if(p.ragResources==='متأخر'){ score+=2; reasons.push('نقص حاد في الموارد'); }
  else if(p.ragResources==='يحتاج متابعة'){ score+=1; reasons.push('كفاية الموارد تحتاج متابعة'); }
  const level = score>=5 ? 'عالي' : score>=2 ? 'متوسط' : 'منخفض';
  if(!reasons.length) reasons.push('لا توجد مؤشرات مخاطرة حالياً');
  return {score, level, reasons};
}
function riskRecommendationText(level, reasons){
  if(level==='عالي') return 'مراجعة تنفيذية عاجلة موصى بها — أبرز الأسباب: ' + reasons.slice(0,2).join('، ');
  if(level==='متوسط') return 'متابعة دورية موصى بها لمعالجة: ' + (reasons[0]||'نقاط الانتباه الحالية');
  return 'المشروع مستقر ضمن المؤشرات الحالية — الاستمرار بالمتابعة الروتينية';
}

function reportManager(p){ return p?.manager || 'فريق عمادة التعليم الإلكتروني وتقنية المعلومات'; }
function reportVendor(p){ return p?.vendor || 'تنفيذ داخلي — عمادة التعليم الإلكتروني وتقنية المعلومات'; }
function reportPortfolio(p){ return p?.portfolio || 'الابتكار الرقمي'; }
function reportProgram(p){ return p?.program || p?.initiative || 'البنية التحتية والحلول الرقمية'; }
function reportChangeRequests(p){ return p?.changeRequestsNote || 'لا يوجد طلبات تغيير'; }
function reportContractAmount(p){ return Number(p?.allocatedBudget||0); }
function reportContractAmountRevised(p){ return Number(p?.contractAmountRevised || p?.allocatedBudget || 0); }

function fallbackMilestones(p){
  if((p?.milestones||[]).length) return p.milestones;
  const start = new Date(p?.startDate || '2026-01-01');
  const end = new Date(p?.endDate || '2028-12-31');
  const totalMs = Math.max(30*86400000, end-start);
  const phases = ['توقيع العقد وتحديد النطاق','التخطيط والتصميم التفصيلي','التنفيذ والتطوير','الاختبار والتشغيل التجريبي','التسليم والتشغيل الفعلي','قياس جودة الخدمات المقدمة','التقرير الختامي وإغلاق المشروع'];
  const n = phases.length;
  const comp = Number(p?.currentCompletion||0);
  return phases.map((name,i)=>{
    const segStart = new Date(start.getTime() + totalMs*(i/n));
    const segEnd = new Date(start.getTime() + totalMs*((i+1)/n));
    const posPct = ((i+1)/n)*100, prevPct = (i/n)*100;
    const mComp = comp>=posPct ? 100 : (comp<=prevPct ? 0 : Math.round(((comp-prevPct)/(100/n))*100));
    return {id:uid('MS'), name, start:segStart.toISOString().slice(0,10), end:segEnd.toISOString().slice(0,10), completion:mComp};
  });
}
function statusColorFor(m){
  const due = new Date(m.end); const now = new Date();
  if((m.completion||0)>=100) return 'green';
  if(due < now){ const overdueDays = (now-due)/86400000; return overdueDays>30 ? 'red' : 'amber'; }
  return 'green';
}
function fallbackDeliverables(p, milestones){
  return milestones.map(m=>{
    const done = (m.completion||0)>=100;

    return {

      evalText: done ? 'معتمد' : (started ? 'قيد المراجعة الفنية' : 'لم يُستحق التقييم بعد'),
      notes: done ? 'تم الاستلام دون ملاحظات' : (started ? 'العمل جارٍ ضمن الجدول الزمني المعتمد' : 'مجدول ضمن المراحل القادمة'),
      color: statusColorFor(m)
    };
  });
}
function quartersRange(startDate, endDate){
  const s = new Date(startDate||'2026-01-01'), e = new Date(endDate||'2028-12-31');
  const startY = s.getFullYear(), endY = Math.max(e.getFullYear(), s.getFullYear());
  const qs = [];
  for(let y=startY; y<=endY; y++) for(let q=1; q<=4; q++) qs.push({year:y, q});
  return qs;
}
function quarterOf(dateStr){ const d = new Date(dateStr); return {year:d.getFullYear(), q: Math.floor(d.getMonth()/3)+1}; }
function quarterIdx(qs, year, q){ return qs.findIndex(x=>x.year===year && x.q===q); }

function donutStyle(pct, colorVar){
  pct = Math.max(0, Math.min(100, pct));
  return `background:conic-gradient(var(${colorVar}) 0% ${pct}%, #e3ded0 ${pct}% 100%)`;
}

    return `<tr>${cells}<td class="pct">${m.completion||0}%</td><td class="lbl">${esc(m.name)}</td><td class="num">${i+1}</td></tr>`;
  }).join('');
  const yearHeaderCells = years.map(y=>`<th class="yr" colspan="${byYear[y]}">${y}</th>`).join('');
  const quarterHeaderCells = qs.map(q=>`<th>Q${q.q}</th>`).join('');
  const page2 = `<div class="rp-page">

  const dlRows = deliverables.map((d,i)=>`<tr>

  return page1 + page2 + page3;
}

/* ---- Word-editable version of the report: pure tables + bgcolor (Word's HTML
   renderer has no CSS grid, flexbox, or conic-gradient support) ---- */
function wbar(pct, colorHex){
  pct = Math.max(0, Math.min(100, Math.round(pct)));
  const total = 200;
  const filled = Math.round(total * pct / 100);
  const rest = total - filled;
  return `<table border="0" cellspacing="0" cellpadding="0" style="width:${total}px"><tr>
    ${filled>0?`<td width="${filled}" bgcolor="${colorHex}" style="height:16px;font-size:1px;line-height:1px">&nbsp;</td>`:''}
    ${rest>0?`<td width="${rest}" bgcolor="#E3DED0" style="height:16px;font-size:1px;line-height:1px">&nbsp;</td>`:''}
  </tr></table>`;
}
function wReportHead(p){
  return `<table class="doc-head"><tr>
    <td style="width:66%"><div class="doc-title" style="text-align:right;font-size:19px">${esc(p.nameAr)}</div></td>
    <td style="width:34%;text-align:left"><img src="data:image/png;base64,${LOGO_B64}" style="height:44px"></td>
  </tr></table>`;
}
function buildReportWordHtml(p){
  const ms = fallbackMilestones(p);
  const deliverables = fallbackDeliverables(p, ms);
  const comp = Number(p.currentCompletion||0);
  const planned = Number(p.plannedCompletion||comp);
  const contractAmt = reportContractAmount(p);
  const contractAmtRevised = reportContractAmountRevised(p);
  const actualSpend = Number(p.actualSpend || Math.round(contractAmt*(comp/100)));
  const spendTotal = Math.max(1, contractAmt||actualSpend||1);
  const spendPct = Math.round((actualSpend/spendTotal)*100);
  const targets = (p.kpis ? p.kpis.split(/[•·]/).map(s=>s.trim()).filter(Boolean) : []);
  if(!targets.length) targets.push(p.goal || 'تنفيذ المشروع وفق النطاق والجدول الزمني المعتمدين');

  /* ---- Page 1: executive summary ---- */
  const page1 = `${wReportHead(p)}
  <div class="doc-sub" style="margin-bottom:10px">تقرير حالة مشروع — ${esc(state.org.nameAr)}</div>
  <table border="1" style="border-collapse:collapse">
    <tr>${xl('المحفظة')}${xl('البرنامج')}${xl('الشركة المنفذة')}${xl('مدير المشروع')}${xl('تاريخ البداية')}${xl('تاريخ النهاية')}${xl('طلبات التغيير')}</tr>
    <tr>${xd(esc(reportPortfolio(p)))}${xd(esc(reportProgram(p)))}${xd(esc(reportVendor(p)))}${xd(esc(reportManager(p)))}${xd(fmtDate(p.startDate))}${xd(fmtDate(p.estimatedEndDate||p.endDate))}${xd(esc(reportChangeRequests(p)))}</tr>
  </table>
  <table><tr>${sectionHeader('وصف المشروع',1)}</tr><tr><td>${esc(p.goal ? (p.goal + (p.transformationGoal? ' — يخدم الهدف الاستراتيجي: '+p.transformationGoal : '')) : ('يهدف هذا المشروع إلى تنفيذ '+p.nameAr+' وتقديم خدماته للمستفيدين بجودة عالية بما يخدم أهداف التحول الرقمي بجامعة الطائف.'))}</td></tr></table>
  <table>
    ${sectionHeader('الأداء المالي والتقدم', 2)}
    <tr><td class="lbl">نسبة الصرف (${spendPct}%)</td><td>${wbar(spendPct,'#537E54')}</td></tr>
    <tr><td class="lbl">نسبة الإنجاز المخططة (${planned}%)</td><td>${wbar(planned,'#D5B254')}</td></tr>
    <tr><td class="lbl">نسبة الإنجاز الفعلية (${comp}%)</td><td>${wbar(comp,'#537E54')}</td></tr>
    <tr><td class="lbl">مبلغ التعاقد</td><td>${fmtMoneyFilled(contractAmt)}</td></tr>
    <tr><td class="lbl">مبلغ التعاقد بعد التغيير</td><td>${fmtMoneyFilled(contractAmtRevised)}</td></tr>
  </table>
  <table>
    ${sectionHeader('المستهدفات', 2)}
    <tr><td class="lbl" style="width:100px">نسبة التحقيق</td><td class="lbl">المستهدف</td></tr>
    ${targets.map(t=>`<tr><td style="text-align:center;font-weight:bold">${comp}%</td><td>${esc(t)}</td></tr>`).join('')}
  </table>
  <p class="small"><font color="#2f7d45">&#9679;</font> على المسار / مكتمل &nbsp;&nbsp; <font color="#c98a1f">&#9679;</font> تأخير طفيف &gt; 5% &nbsp;&nbsp; <font color="#c83b3b">&#9679;</font> تأخير حرج &gt; 15%</p>`;

  /* ---- Page 2: quarterly timeline ---- */
  const qs = quartersRange(
    ms.reduce((min,m)=>m.start<min?m.start:min, p.startDate||ms[0].start),
    ms.reduce((max,m)=>m.end>max?m.end:max, p.endDate||ms[0].end)
  );
  const nowQ = quarterOf(today());
  const tlRows = ms.map((m,i)=>{
    const s = quarterOf(m.start), e = quarterOf(m.end);
    const si = Math.max(0, quarterIdx(qs, s.year, s.q));
    const ei = Math.max(si, quarterIdx(qs, e.year, e.q));
    const cells = qs.map((q,qi)=>{
      const active = qi>=si && qi<=ei;
      return `<td style="width:13px;height:17px;padding:0;font-size:1px"${active?' bgcolor="#537E54"':''}>&nbsp;</td>`;
    }).join('');
    return `<tr>${cells}<td style="text-align:center;font-weight:bold;font-size:9px">${m.completion||0}%</td><td style="text-align:right;font-size:9px;white-space:nowrap">${esc(m.name)}</td><td style="text-align:center;font-size:9px">${i+1}</td></tr>`;
  }).join('');
  const years = [...new Set(qs.map(q=>q.year))];
  const yearHeaderCells = years.map(y=>{
    const span = qs.filter(q=>q.year===y).length;
    return `<td colspan="${span}" bgcolor="#537E54" style="text-align:center"><font color="#FFFFFF"><b>${y}</b></font></td>`;
  }).join('');
  const quarterHeaderCells = qs.map(q=>`<td bgcolor="#537E54" style="text-align:center;font-size:8px"><font color="#FFFFFF"><b>Q${q.q}</b></font></td>`).join('');
  const page2 = `<br style="page-break-before:always">
  ${wReportHead(p)}
  <p style="font-weight:bold;font-size:14px;color:#537E54;margin-top:10px">الجدول الزمني للمعالم الرئيسية</p>
  <table border="1" style="border-collapse:collapse;font-size:9px">
    <tr>${yearHeaderCells}<td bgcolor="#537E54"></td><td bgcolor="#537E54"></td><td bgcolor="#537E54"></td></tr>
    <tr>${quarterHeaderCells}<td bgcolor="#537E54"><font color="#FFFFFF"><b>%</b></font></td><td bgcolor="#537E54"><font color="#FFFFFF"><b>المعالم الرئيسية</b></font></td><td bgcolor="#537E54"><font color="#FFFFFF"><b>#</b></font></td></tr>
    ${tlRows}
  </table>
  <p class="small">المؤشر الزمني الحالي: الربع ${nowQ.q} من عام ${nowQ.year}</p>
  <p class="small"><font color="#2f7d45">&#9679;</font> على المسار / مكتمل &nbsp;&nbsp; <font color="#c98a1f">&#9679;</font> تأخر &gt; 5% &nbsp;&nbsp; <font color="#c83b3b">&#9679;</font> حرج &gt; 15%</p>`;

  /* ---- Page 3: deliverables ---- */
  const dlRows = deliverables.map((d,i)=>{
    const dotColor = d.color==='green'?'#2f7d45':d.color==='amber'?'#c98a1f':'#c83b3b';
    return `<tr>
      <td style="text-align:center">${i+1}</td>
      <td>${esc(d.title)}</td>
      <td>${fmtDate(d.due)}</td>
      <td>${esc(d.received)}</td>
      <td>${esc(d.evalText)}</td>
      <td>${esc(d.notes)}</td>
      <td style="text-align:center"><font color="${dotColor}">●</font></td>
    </tr>`;
  }).join('');
  const page3 = `<br style="page-break-before:always">
  ${wReportHead(p)}
  <p style="font-weight:bold;font-size:14px;color:#537E54;margin-top:10px">مخرجات المشروع</p>
  <table border="1" style="border-collapse:collapse">
    <tr>${xl('#')}${xl('المخرجات')}${xl('التاريخ المحدد للاستلام')}${xl('حالة الاستلام')}${xl('التقييم الفني للمخرج')}${xl('ملاحظات')}${xl('الحالة')}</tr>
    ${dlRows}
  </table>
  <p class="small"><font color="#2f7d45">&#9679;</font> على المسار &nbsp;&nbsp; <font color="#c98a1f">&#9679;</font> تأخير بسيط &nbsp;&nbsp; <font color="#c83b3b">&#9679;</font> تأخير حرج</p>`;

  return page1 + page2 + page3;
}
function downloadReportWord(id){
  const p = projectById(id);
  if(!p) return;
  const html = wordHeader('تقرير حالة مشروع — ' + p.nameAr) + buildReportWordHtml(p) + wordFooter();
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `Project-Status-Report-${p.code}-${today()}.doc`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(`جاري تنزيل تقرير "${p.nameAr}" كملف Word قابل للتعديل...`);
}
function printProjectReport(id){
  const p = projectById(id);
  document.getElementById('printArea').innerHTML = buildReportHtml(p);
  window.print();
}
function logReportIssued(id){
  const p = projectById(id);
  p.reportsLog = p.reportsLog||[];
  p.reportsLog.push({id:uid('REP'), date:today(), snapshotCompletion:p.currentCompletion, snapshotStatus:overallStatus(p).label});
  save(); toast('تم تسجيل إصدار التقرير في سجل المشروع');
}

function downloadTemplate(kind){

    cost:{file:'templates/Cost-Management-Plan-Template.docx', base:'Cost-Management-Plan'}

  const p = pid ? projectById(pid) : null;
  const code = p ? p.code : 'PROJECTCODE';
  const ext = conf.file.split('.').pop();

  a.href = conf.file; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  toast('جاري تنزيل النموذج...');
}

function downloadXls(html, filename){
  const blob = new Blob(['\ufeff', html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function downloadFilledTemplate(kind){
  const pid = document.getElementById('fillProject')?.value;
  const p = pid ? projectById(pid) : null;
  const code = p ? p.code : 'PROJECTCODE';
  const excelKinds = { progress:{fn:buildProgressUpdateXlsHtml, base:'Progress-Update'}, schedule:{fn:buildScheduleXlsHtml, base:'Project-Schedule'} };
  if(excelKinds[kind]){
    const conf = excelKinds[kind];
    const html = conf.fn(p);
    downloadXls(html, `${conf.base}-${code}-${today()}.xls`);
    toast(p ? `جاري تنزيل النموذج معبأً ببيانات "${p.nameAr}"...` : 'جاري تنزيل النموذج الفارغ...');
    return;
  }
  let html, base;
  if(kind==='charter'){ html = buildCharterHtml(p); base='Project-Charter'; }
  else if(kind==='certificate'){ html = buildCertificateHtml(p); base='Completion-Certificate'; }
  else if(kind==='closure'){ html = buildClosureHtml(p); base='Project-Closure'; }
  else if(kind==='change'){ html = buildChangeRequestHtml(p); base='Change-Request'; }
  else if(kind==='costplan'){ html = buildCostPlanDocHtml(p); base='Cost-Management-Plan'; }
  else return;
  const fname = `${base}-${code}-${today()}.doc`;
  const blob = new Blob(['\ufeff', html], {type:'application/msword'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = fname;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(p ? `جاري تنزيل النموذج معبأً ببيانات "${p.nameAr}"...` : 'جاري تنزيل النموذج الفارغ...');
}

function saveSettings(e){
  e.preventDefault();
  const f = new FormData(e.target);
  state.org.nameAr = f.get('nameAr'); state.org.nameEn = f.get('nameEn'); state.org.user = f.get('user');
  save(); applyOrgBranding(); toast('تم حفظ الإعدادات');
}
function applyOrgBranding(){
  document.getElementById('sysNameAr').textContent = state.org.nameAr;
  document.getElementById('sysNameEn').textContent = state.org.nameEn;
  document.getElementById('userChip').textContent = state.org.user;
  document.title = state.org.nameAr + ' | جامعة الطائف';
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `tu-pms-backup-${today()}.json`;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  toast('تم تصدير النسخة الاحتياطية');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try{
      const data = JSON.parse(reader.result);
      if(!data.projects) throw new Error('invalid');
      state = data; save(); applyOrgBranding(); toast('تم استيراد البيانات بنجاح'); go('dashboard');
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('سيتم حذف جميع البيانات الحالية واستعادة الإعدادات الافتراضية. هل تريد المتابعة؟')) return;
  state = defaultState(); save(); applyOrgBranding(); toast('تمت إعادة تعيين البيانات'); go('dashboard');
}

function exportProjectsCSV(){
  const rows = [['رمز المشروع','اسم المشروع','مدير المشروع','المرحلة','تاريخ البداية','تاريخ النهاية','نسبة الإنجاز','الحالة','الميزانية المعتمدة','الصرف الفعلي']];
  state.projects.forEach(p=>{
    const st = overallStatus(p);
    rows.push([p.code,p.nameAr,p.manager||'',p.phase,p.startDate||'',p.endDate||'',(p.currentCompletion||0)+'%',st.label,p.allocatedBudget||0,p.actualSpend||0]);
  });
  const csv = '\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');
  const blob = new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `portfolio-report-${today()}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('تم تجهيز ملف CSV متوافق مع Excel');
}

/* ================= MODAL / TOAST ================= */
function showModal(title, body){
  document.getElementById('modalBox').innerHTML = `<div class="modal-head"><h2>${esc(title)}</h2><button class="close" onclick="closeModal()">✕</button></div>${body}`;
  document.getElementById('modal').classList.add('open');
  document.getElementById('modal').setAttribute('aria-hidden','false');
  setTimeout(()=>document.querySelector('#modalBox input, #modalBox select, #modalBox textarea')?.focus(),40);
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  document.getElementById('modal').setAttribute('aria-hidden','true');
}
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}

function render(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active', b.dataset.p===currentPage || (currentPage.startsWith('project') && b.dataset.p==='projects') ));
  let html = '';
  if(currentPage==='dashboard') html = pageDashboard();
  else if(currentPage==='projects') html = pageProjects();
  else if(currentPage==='projectDetail') html = pageProjectDetail(currentProjectId);
  else if(currentPage==='projectReport') html = pageProjectReport(currentProjectId);
  else if(currentPage==='schedule') html = pageSchedule();
  else if(currentPage==='risks') html = pageRisks();
  else if(currentPage==='reports') html = pageReports();
  else if(currentPage==='templates') html = pageTemplates();
  else if(currentPage==='leadership') html = pageLeadership();
  else if(currentPage==='decisionsCenter') html = pageDecisionsCenter();
  else if(currentPage==='decisionAnalytics') html = pageDecisionAnalytics();
  else if(currentPage==='notifications') html = pageNotifications();
  else if(currentPage==='settings') html = pageSettings();
  else html = pageDashboard();
  document.getElementById('app').innerHTML = html;
  const badge = document.getElementById('notifBadge');
  const unread = state.notifications.filter(n=>!n.read).length;
  badge.hidden = unread===0; badge.textContent = unread;
}

applyOrgBranding();
render();
window.addEventListener('hashchange', ()=>{ const h = location.hash.replace('#',''); if(h) { currentPage = h.split('/')[0]; render(); } });
</script>
</body>
</html>
